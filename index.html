<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイムAR星空オルゴール</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    canvas { display: block; }
    
    .material-symbols-outlined {
      font-size: 20px;
      vertical-align: middle;
      user-select: none;
    }

    #info { position: absolute; top: 10px; left: 10px; font-size: 12px; color: rgba(255,255,255,0.8); z-index: 5; line-height: 1.5; pointer-events: none; }

    #sidebar-toggle {
      position: absolute; top: 12px; right: 12px; z-index: 30;
      width: 44px; height: 44px; background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; color: white;
      cursor: pointer; display: flex; justify-content: center; align-items: center;
    }

    #sidebar {
      position: absolute; top: 0; right: -300px; width: 300px; height: 100%;
      background: rgba(10, 15, 30, 0.9); backdrop-filter: blur(12px);
      z-index: 25; transition: right 0.3s ease; padding: 60px 20px 20px; box-sizing: border-box;
      border-left: 1px solid rgba(255,255,255,0.1);
      display: flex; flex-direction: column;
    }
    #sidebar.open { right: 0; }

    .sidebar-header {
      font-size: 18px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
    }

    .setting-item {
      display: flex; justify-content: space-between; align-items: center;

    .switch {

    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;

    }
    .slider:before {
      position: absolute; content: ""; height: 24px; width: 24px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    input:checked + .slider { background-color: #2563eb; }
    input:checked + .slider:before { transform: translateX(22px); }

    .section-label {
      font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
    }
    #city-list {
      flex: 1; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; background: rgba(0,0,0,0.2);
    }
    .city-item {
      padding: 12px 16px; font-size: 14px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex; justify-content: space-between; align-items: center; transition: background 0.2s;
    }
    .city-item:last-child { border-bottom: none; }
    .city-item:hover { background: rgba(255,255,255,0.1); }
    .city-item.active { background: rgba(37, 99, 235, 0.3); color: #60a5fa; font-weight: bold; }
  </style>
</head>
<body>

  <div id="info">
    <div id="location-info">観測地: 東京</div>[cite: 5]
    <div id="sensor-info">モード: センサー連動中</div>[cite: 5]
  </div>

  <button id="sidebar-toggle">
    <span class="material-symbols-outlined" id="toggle-icon">settings</span>[cite: 5]
  </button>

  <div id="sidebar">
    <div class="sidebar-header">
      <span class="material-symbols-outlined">settings</span> 設定[cite: 5]
    </div>
    
    <div class="setting-item">
      <span>手動操作モード</span>[cite: 5]
      <label class="switch">
        <input type="checkbox" id="manual-toggle">[cite: 5]
        <span class="slider"></span>[cite: 5]
      </label>
    </div>

    <div class="section-label">
      <span class="material-symbols-outlined">location_on</span> 観測地点を選択[cite: 5]
    </div>
    <div id="city-list"></div>[cite: 5]
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>[cite: 5]
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>[cite: 5]

  <script>
    let scene, camera, renderer, starMesh, controls;
    let userLat = 35.6812, userLon = 139.7671;[cite: 5]
    let cityName = "東京";[cite: 5]
    const locationEl = document.getElementById('location-info');[cite: 5]
    const sensorEl = document.getElementById('sensor-info');[cite: 5]

    let isManualMode = false;[cite: 5]
    let realStarsData = [];[cite: 5]
    let solarSystemGroup = new THREE.Group();

    const targetQuaternion = new THREE.Quaternion();[cite: 5]
    const zee = new THREE.Vector3(0, 0, 1);[cite: 5]
    const euler = new THREE.Euler();[cite: 5]
    const q0 = new THREE.Quaternion();[cite: 5]
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));[cite: 5]

    const cities = [
      { name: "現在地 (GPS)", lat: null, lon: null, isGps: true },[cite: 5]
      { name: "札幌", lat: 43.0618, lon: 141.3545 },[cite: 5]
      { name: "仙台 (宮城)", lat: 38.2682, lon: 140.8694 },[cite: 5]
      { name: "東京", lat: 35.6812, lon: 139.7671 },[cite: 5]
      { name: "名古屋 (愛知)", lat: 35.1815, lon: 136.9064 },[cite: 5]
      { name: "大阪", lat: 34.6937, lon: 135.5023 },[cite: 5]
      { name: "福岡", lat: 33.5902, lon: 130.4017 },[cite: 5]
      { name: "那覇 (沖縄)", lat: 26.2123, lon: 127.6792 },[cite: 5]
      { name: "ニューヨーク", lat: 40.7128, lon: -74.0060 },[cite: 5]
      { name: "ロンドン", lat: 51.5074, lon: -0.1278 },[cite: 5]
      { name: "パリ", lat: 48.8566, lon: 2.3522 },[cite: 5]
      { name: "シドニー", lat: -33.8688, lon: 151.2093 },[cite: 5]
      { name: "ホノルル", lat: 21.3069, lon: -157.8583 }[cite: 5]
    ];

    async function loadRealStarCatalog() {
      try {
        const response = await fetch('https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/data/stars.6.json');[cite: 5]
        const data = await response.json();[cite: 5]
        
        realStarsData = data.features.map(f => {[cite: 5]
          const coords = f.geometry.coordinates;[cite: 5]
          const mag = f.properties.mag;[cite: 5]
          const bv = f.properties.bv || 0.4;[cite: 5]

          let color = new THREE.Color(0xffffff);[cite: 5]
          if (bv < 0.0) color.setHex(0x9bb0ff);[cite: 5]
          else if (bv < 0.4) color.setHex(0xcad8ff);[cite: 5]
          else if (bv < 0.8) color.setHex(0xffffff);[cite: 5]
          else if (bv < 1.2) color.setHex(0xffdd85);[cite: 5]
          else color.setHex(0xffa050);[cite: 5]

          return {
            ra: coords[0] / 15,[cite: 5]
            dec: coords[1],[cite: 5]
            mag: mag,[cite: 5]
            color: color[cite: 5]
          };
        });

        buildRealStarField();[cite: 5]
      } catch (e) {
        console.error("星データの読み込みに失敗しました:", e);[cite: 5]
      }
    }

    function raDecToAltAz(raHours, decDeg, latDeg, lonDeg, date) {
      const dec = decDeg * (Math.PI / 180);[cite: 5]
      const lat = latDeg * (Math.PI / 180);[cite: 5]
      const d = (date.getTime() / 86400000) - 10957.5;[cite: 5]
      const gmst = (18.697374558 + 24.06570982441908 * d) % 24;[cite: 5]
      const lst = (gmst + lonDeg / 15 + 24) % 24;[cite: 5]
      const ha = (lst - raHours) * 15 * (Math.PI / 180);[cite: 5]
      const sinAlt = Math.sin(dec) * Math.sin(lat) + Math.cos(dec) * Math.cos(lat) * Math.cos(ha);[cite: 5]
      const alt = Math.asin(sinAlt);[cite: 5]
      const cosAz = (Math.sin(dec) - Math.sin(alt) * Math.sin(lat)) / (Math.cos(alt) * Math.cos(lat));[cite: 5]
      let az = Math.acos(Math.max(-1, Math.min(1, cosAz)));[cite: 5]
      if (Math.sin(ha) > 0) az = 2 * Math.PI - az;[cite: 5]
      return { alt: alt, az: az };[cite: 5]
    }

    /* --- 太陽系天体の軌道計算（簡易ケプラー要素） --- */
    function getSolarSystemPositions(date) {
      const d = (date.getTime() / 86400000) - 10957.5; // J2000.0からの経過日数

      // 太陽 (黄経)
      const L_sun = (280.460 + 0.9856474 * d) % 360;
      const g_sun = (357.528 + 0.9856003 * d) * (Math.PI / 180);
      const lambda_sun = (L_sun + 1.915 * Math.sin(g_sun) + 0.020 * Math.sin(2 * g_sun)) % 360;
      const rad_sun = lambda_sun * (Math.PI / 180);
      const eps = 23.439 * (Math.PI / 180); // 黄道傾斜角

      const sunRa = Math.atan2(Math.cos(eps) * Math.sin(rad_sun), Math.cos(rad_sun)) * (180 / Math.PI) / 15;
      const sunDec = Math.asin(Math.sin(eps) * Math.sin(rad_sun)) * (180 / Math.PI);

      // 月 (簡易近似)
      const L_moon = (218.316 + 13.176396 * d) % 360;
      const M_moon = (134.963 + 13.064993 * d) * (Math.PI / 180);
      const F_moon = (93.272 + 13.229350 * d) * (Math.PI / 180);
      const lambda_moon = (L_moon + 6.289 * Math.sin(M_moon)) % 360;
      const beta_moon = 5.128 * Math.sin(F_moon);
      const rad_lmoon = lambda_moon * (Math.PI / 180);
      const rad_bmoon = beta_moon * (Math.PI / 180);

      const moonRa = Math.atan2(Math.sin(rad_lmoon) * Math.cos(eps) - Math.tan(rad_bmoon) * Math.sin(eps), Math.cos(rad_lmoon)) * (180 / Math.PI) / 15;
      const moonDec = Math.asin(Math.sin(rad_bmoon) * Math.cos(eps) + Math.cos(rad_bmoon) * Math.sin(eps) * Math.sin(rad_lmoon)) * (180 / Math.PI);

      // 惑星群 (太陽系中心座標から地心視運動への近似変換)
      const planetParams = [
        { name: "水星", color: 0xb5a7a7, size: 2.2, a: 0.387, P: 0.241, e: 0.2056, L0: 252.25, w: 77.45 },
        { name: "金星", color: 0xffd700, size: 3.5, a: 0.723, P: 0.615, e: 0.0067, L0: 181.98, w: 131.53 },
        { name: "火星", color: 0xff4500, size: 3.0, a: 1.524, P: 1.881, e: 0.0934, L0: 355.45, w: 336.04 },
        { name: "木星", color: 0xffa500, size: 4.2, a: 5.203, P: 11.86, e: 0.0484, L0: 34.40,  w: 14.75 },
        { name: "土星", color: 0xf4a460, size: 3.8, a: 9.537, P: 29.46, e: 0.0541, L0: 49.94,  w: 92.43 },
        { name: "天王星", color: 0x7fffd4, size: 2.5, a: 19.19, P: 84.01, e: 0.0472, L0: 313.23, w: 170.96 },
        { name: "海王星", color: 0x4169e1, size: 2.5, a: 30.07, P: 164.8, e: 0.0086, L0: 304.88, w: 44.97 }
      ];

      const r_sun_dist = 1.0;
      const x_sun = r_sun_dist * Math.cos(rad_sun);
      const y_sun = r_sun_dist * Math.sin(rad_sun);

      const bodies = [
        { name: "太陽", ra: (sunRa + 24) % 24, dec: sunDec, color: 0xffcc00, size: 6.0 },
        { name: "月",   ra: (moonRa + 24) % 24, dec: moonDec, color: 0xffffff, size: 5.0 }
      ];

      planetParams.forEach(p => {
        const M = ((p.L0 + (365.25 * d / (p.P * 365.25)) * 360 - p.w) % 360) * (Math.PI / 180);
        const E = M + p.e * Math.sin(M);
        const x_plan = p.a * (Math.cos(E) - p.e);
        const y_plan = p.a * Math.sqrt(1 - p.e * p.e) * Math.sin(E);

        const w_rad = p.w * (Math.PI / 180);
        const x_helio = x_plan * Math.cos(w_rad) - y_plan * Math.sin(w_rad);
        const y_helio = x_plan * Math.sin(w_rad) + y_plan * Math.cos(w_rad);

        const x_geo = x_helio + x_sun;
        const y_geo = y_helio + y_sun;

        let lambda_geo = Math.atan2(y_geo, x_geo);
        const p_ra = Math.atan2(Math.sin(lambda_geo) * Math.cos(eps), Math.cos(lambda_geo)) * (180 / Math.PI) / 15;
        const p_dec = Math.asin(Math.sin(eps) * Math.sin(lambda_geo)) * (180 / Math.PI);

        bodies.push({
          name: p.name,
          ra: (p_ra + 24) % 24,
          dec: p_dec,
          color: p.color,
          size: p.size
        });
      });

      return bodies;
    }

    function createTextSprite(text, colorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.font = 'Bold 24px sans-serif';
      ctx.fillStyle = '#' + colorHex.toString(16).padStart(6, '0');
      ctx.textAlign = 'center';
      ctx.fillText(text, 64, 40);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(12, 6, 1);
      return sprite;
    }

    function initThree() {
      scene = new THREE.Scene();[cite: 5]
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);[cite: 5]
      camera.position.set(0, 0, 0.1);[cite: 5]

      renderer = new THREE.WebGLRenderer({ antialias: true });[cite: 5]
      renderer.setSize(window.innerWidth, window.innerHeight);[cite: 5]
      renderer.setPixelRatio(window.devicePixelRatio);[cite: 5]
      document.body.appendChild(renderer.domElement);[cite: 5]

      controls = new THREE.OrbitControls(camera, renderer.domElement);[cite: 5]
      controls.enableZoom = false;[cite: 5]
      controls.enablePan = false;[cite: 5]
      controls.rotateSpeed = -0.5;[cite: 5]
      controls.enabled = false;[cite: 5]

      scene.add(solarSystemGroup);

      loadRealStarCatalog();[cite: 5]

      window.addEventListener('resize', () => {[cite: 5]
        camera.aspect = window.innerWidth / window.innerHeight;[cite: 5]
        camera.updateProjectionMatrix();[cite: 5]
        renderer.setSize(window.innerWidth, window.innerHeight);[cite: 5]
      });
    }

    function buildRealStarField() {
      if (!realStarsData.length) return;[cite: 5]
      if (starMesh) scene.remove(starMesh);[cite: 5]

      const geometry = new THREE.BufferGeometry();[cite: 5]
      const positions = [];[cite: 5]
      const colors = [];[cite: 5]
      const now = new Date();[cite: 5]
      const radius = 100;[cite: 5]

      realStarsData.forEach(star => {[cite: 5]
        const pos = raDecToAltAz(star.ra, star.dec, userLat, userLon, now);[cite: 5]

        const x = radius * Math.cos(pos.alt) * Math.sin(pos.az);[cite: 5]
        const y = radius * Math.sin(pos.alt);[cite: 5]
        const z = -radius * Math.cos(pos.alt) * Math.cos(pos.az);[cite: 5]
        positions.push(x, y, z);[cite: 5]

        const brightness = Math.max(0.15, Math.min(1.0, 1 - (star.mag / 6.0)));[cite: 5]
        const c = star.color;[cite: 5]
        colors.push(c.r * brightness, c.g * brightness, c.b * brightness);[cite: 5]
      });

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));[cite: 5]
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));[cite: 5]

      const material = new THREE.PointsMaterial({[cite: 5]
        size: 0.7,[cite: 5]
        vertexColors: true,[cite: 5]
        transparent: true,[cite: 5]
        opacity: 0.9,[cite: 5]
        sizeAttenuation: false[cite: 5]
      });
      
      starMesh = new THREE.Points(geometry, material);[cite: 5]
      scene.add(starMesh);[cite: 5]

      // 太陽系天体の生成・配置
      buildSolarSystem(now);
    }

    function buildSolarSystem(date) {
      // 既存の天体オブジェクトを消去
      while (solarSystemGroup.children.length > 0) {
        const obj = solarSystemGroup.children[0];
        solarSystemGroup.remove(obj);
      }

      const radius = 95; // 恒星より僅かに手前
      const bodies = getSolarSystemPositions(date);

      bodies.forEach(body => {
        const pos = raDecToAltAz(body.ra, body.dec, userLat, userLon, date);

        const x = radius * Math.cos(pos.alt) * Math.sin(pos.az);
        const y = radius * Math.sin(pos.alt);
        const z = -radius * Math.cos(pos.alt) * Math.cos(pos.az);

        // 天体本体（球体メッシュ）
        const sphereGeo = new THREE.SphereGeometry(body.size * 0.4, 16, 16);
        const sphereMat = new THREE.MeshBasicMaterial({ color: body.color });
        const mesh = new THREE.Mesh(sphereGeo, sphereMat);
        mesh.position.set(x, y, z);
        solarSystemGroup.add(mesh);

        // ラベルテキスト
        const label = createTextSprite(body.name, body.color);
        label.position.set(x * 1.05, y * 1.05 + 1.5, z * 1.05);
        solarSystemGroup.add(label);
      });
    }

    function animate() {
      requestAnimationFrame(animate);[cite: 5]
      if (isManualMode) {[cite: 5]
        controls.update();[cite: 5]
      } else {
        camera.quaternion.slerp(targetQuaternion, 0.1);[cite: 5]
      }
      renderer.render(scene, camera);[cite: 5]
    }

    function onDeviceOrientation(event) {
      if (isManualMode) return;

      // iOSのコンパス（絶対方位）補正処理
      let alpha = event.alpha || 0;
      if (event.webkitCompassHeading !== undefined) {
        alpha = 360 - event.webkitCompassHeading;
      }

      const alphaRad = THREE.MathUtils.degToRad(alpha);
      const betaRad  = THREE.MathUtils.degToRad(event.beta || 0);
      const gammaRad = THREE.MathUtils.degToRad(event.gamma || 0);
      const orient   = THREE.MathUtils.degToRad(window.orientation || 0);

      euler.set(betaRad, alphaRad, -gammaRad, 'YXZ');
      targetQuaternion.setFromEuler(euler);
      targetQuaternion.multiply(q1);
      q0.setFromAxisAngle(zee, -orient);
      targetQuaternion.multiply(q0);
    }

    const sidebar = document.getElementById('sidebar');[cite: 5]
    const sidebarToggle = document.getElementById('sidebar-toggle');[cite: 5]
    const toggleIcon = document.getElementById('toggle-icon');[cite: 5]
    const manualToggle = document.getElementById('manual-toggle');[cite: 5]
    const cityListEl = document.getElementById('city-list');[cite: 5]

    sidebarToggle.addEventListener('click', () => {[cite: 5]
      sidebar.classList.toggle('open');[cite: 5]
      const isOpen = sidebar.classList.contains('open');[cite: 5]
      toggleIcon.innerText = isOpen ? 'close' : 'settings';[cite: 5]
    });

    manualToggle.addEventListener('change', (e) => {[cite: 5]
      isManualMode = e.target.checked;[cite: 5]
      controls.enabled = isManualMode;[cite: 5]
      sensorEl.innerText = isManualMode ? "モード: 手動ドラッグ" : "モード: センサー連動";[cite: 5]
    });

    function renderCityList() {
      cityListEl.innerHTML = '';[cite: 5]
      cities.forEach(city => {[cite: 5]
        const item = document.createElement('div');[cite: 5]
        item.className = `city-item ${cityName === city.name ? 'active' : ''}`;[cite: 5]
        
        let iconHtml = city.isGps ? '<span class="material-symbols-outlined" style="font-size:16px;">near_me</span>' : '';[cite: 5]
        item.innerHTML = `<span>${city.name}</span> ${iconHtml}`;[cite: 5]

        item.addEventListener('click', () => {[cite: 5]
          if (city.isGps) {[cite: 5]
            fetchGpsLocation();[cite: 5]
          } else {
            userLat = city.lat;[cite: 5]
            userLon = city.lon;[cite: 5]
            cityName = city.name;[cite: 5]
            locationEl.innerText = `観測地: ${cityName} (北緯${userLat.toFixed(1)}° 東経${userLon.toFixed(1)}°)`;[cite: 5]
            buildRealStarField();[cite: 5]
            renderCityList();[cite: 5]
          }
        });

        cityListEl.appendChild(item);[cite: 5]
      });
    }

    function fetchGpsLocation() {
      if (navigator.geolocation) {[cite: 5]
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLat = pos.coords.latitude;[cite: 5]
            userLon = pos.coords.longitude;[cite: 5]
            cityName = "現在地 (GPS)";[cite: 5]
            locationEl.innerText = `観測地: 現在地 (北緯${userLat.toFixed(2)}° 東経${userLon.toFixed(2)}°)`;[cite: 5]
            buildRealStarField();[cite: 5]
            renderCityList();[cite: 5]
          },
          (err) => {
            console.log("GPS取得スキップ（デフォルト位置で表示中）");[cite: 5]
          }
        );
      }
    }

    window.addEventListener('DOMContentLoaded', () => {[cite: 5]
      initThree();[cite: 5]
      animate();[cite: 5]
      renderCityList();[cite: 5]
      fetchGpsLocation();[cite: 5]

      if (typeof DeviceOrientationEvent !== 'undefined') {[cite: 5]
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {[cite: 5]
          window.addEventListener('click', async () => {[cite: 5]
            try {
              const state = await DeviceOrientationEvent.requestPermission();[cite: 5]
              if (state === 'granted') {[cite: 5]
                window.addEventListener('deviceorientation', onDeviceOrientation, false);[cite: 5]
              }
            } catch (e) {}
          }, { once: true });[cite: 5]
        } else {
          window.addEventListener('deviceorientation', onDeviceOrientation, false);[cite: 5]
        }
      }
    });
  </script>
