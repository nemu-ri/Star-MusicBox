<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイムAR星空オルゴール</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    canvas { display: block; }
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: rgba(5, 7, 20, 0.9); z-index: 10; text-align: center; padding: 20px; box-sizing: border-box;
    }
    button {
      padding: 15px 32px; font-size: 18px; cursor: pointer; background: #4a6fa5; color: white;
      border: none; border-radius: 25px; margin-top: 20px; font-weight: bold;
      box-shadow: 0 4px 15px rgba(74, 111, 165, 0.4);
    }
    #info { position: absolute; top: 10px; left: 10px; font-size: 12px; color: rgba(255,255,255,0.8); z-index: 5; line-height: 1.5; pointer-events: none; }
    
    /* モード切り替えボタンのスタイル */
    #mode-btn {
      position: absolute; top: 10px; right: 10px; z-index: 10; display: none;
      padding: 8px 16px; font-size: 14px; background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px); color: white; border: 1px solid rgba(255,255,255,0.4);
      border-radius: 20px; cursor: pointer; font-weight: bold; margin-top: 0; box-shadow: none;
    }
    #mode-btn:active { background: rgba(255, 255, 255, 0.4); }
  </style>
</head>
<body>

  <div id="overlay">
    <h1>✨ リアルタイムAR星空</h1>
    <p>位置情報とジャイロセンサーを使用して<br>「いま上空にある実際の星空」を再現します。</p>
    <button id="start-btn">位置情報を許可してスタート</button>
  </div>

  <div id="info">
    <div id="location-info">位置情報: 取得中...</div>
    <div id="sensor-info">モード: センサー連動中</div>
  </div>

  <button id="mode-btn">🧭 センサー連動中</button>

  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    let scene, camera, renderer, starMesh, controls;
    let userLat = 35.6812, userLon = 139.7671; // 初期値: 東京
    const locationEl = document.getElementById('location-info');
    const sensorEl = document.getElementById('sensor-info');
    const modeBtn = document.getElementById('mode-btn');

    // モード管理フラグ (false: センサー連動, true: 手動ドラッグ)
    let isManualMode = false;

    // クォータニオン制御用変数（ジンバルロック防止 & スムーズ追従）
    const targetQuaternion = new THREE.Quaternion();
    const zee = new THREE.Vector3(0, 0, 1);
    const euler = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // カメラ初期姿勢オフセット

    // 主要な明るい星のリアルデータ
    const realBrightStars = [
      { name: "シリウス", ra: 6.75, dec: -16.72, mag: -1.46 },
      { name: "カノープス", ra: 6.39, dec: -52.70, mag: -0.74 },
      { name: "ベガ (織姫星)", ra: 18.62, dec: 38.78, mag: 0.03 },
      { name: "アルクトゥルス", ra: 14.26, dec: 19.18, mag: -0.05 },
      { name: "カペラ", ra: 5.28, dec: 46.00, mag: 0.08 },
      { name: "リゲル", ra: 5.24, dec: -8.20, mag: 0.13 },
      { name: "プロキオン", ra: 7.65, dec: 5.22, mag: 0.38 },
      { name: "ベテルギウス", ra: 5.92, dec: 7.41, mag: 0.50 },
      { name: "アルタイル (彦星)", ra: 19.84, dec: 8.87, mag: 0.77 },
      { name: "アルデバラン", ra: 4.60, dec: 16.51, mag: 0.85 },
      { name: "アンタレス", ra: 16.48, dec: -26.43, mag: 0.96 },
      { name: "スピカ", ra: 13.42, dec: -11.16, mag: 0.98 },
      { name: "ポルックス", ra: 7.76, dec: 28.03, mag: 1.14 },
      { name: "デネブ", ra: 20.69, dec: 45.28, mag: 1.25 },
      { name: "レグルス", ra: 10.14, dec: 11.97, mag: 1.36 },
      { name: "北極星 (ポラリス)", ra: 2.53, dec: 89.26, mag: 1.97 }
    ];

    // 1. 方位角(Azimuth)と高度(Altitude)の計算
    function raDecToAltAz(raHours, decDeg, latDeg, lonDeg, date) {
      const dec = decDeg * (Math.PI / 180);
      const lat = latDeg * (Math.PI / 180);

      const d = (date.getTime() / 86400000) - 10957.5;
      const gmst = (18.697374558 + 24.06570982441908 * d) % 24;
      const lst = (gmst + lonDeg / 15 + 24) % 24;
      
      const ha = (lst - raHours) * 15 * (Math.PI / 180);

      const sinAlt = Math.sin(dec) * Math.sin(lat) + Math.cos(dec) * Math.cos(lat) * Math.cos(ha);
      const alt = Math.asin(sinAlt);

      const cosAz = (Math.sin(dec) - Math.sin(alt) * Math.sin(lat)) / (Math.cos(alt) * Math.cos(lat));
      let az = Math.acos(Math.max(-1, Math.min(1, cosAz)));
      if (Math.sin(ha) > 0) az = 2 * Math.PI - az;

      return { alt: alt, az: az };
    }

    // 2. Three.js & OrbitControls 構築
    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0.1); // 手動制御用に少しだけずらす

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      // 手動操作用コントロール設定
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableZoom = false; // 拡大縮小OFF（視界の距離感を固定）
      controls.enablePan = false;  // 平行移動OFF
      controls.rotateSpeed = -0.5; // 回転方向の反転・調整
      controls.enabled = false;    // 初期状態はセンサー連動のためOFF

      buildRealStarField();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // 3. 星の配置
    function buildRealStarField() {
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const colors = [];
      const now = new Date();
      const radius = 100;

      const allStars = [...realBrightStars];
      for (let i = 0; i < 750; i++) {
        allStars.push({
          ra: Math.random() * 24,
          dec: (Math.random() - 0.5) * 180,
          mag: 2 + Math.random() * 3
        });
      }

      allStars.forEach(star => {
        const pos = raDecToAltAz(star.ra, star.dec, userLat, userLon, now);
        
        const x = radius * Math.cos(pos.alt) * Math.sin(pos.az);
        const y = radius * Math.sin(pos.alt);
        const z = -radius * Math.cos(pos.alt) * Math.cos(pos.az);

        positions.push(x, y, z);

        const brightness = Math.max(0.2, 1 - (star.mag / 5));
        colors.push(brightness, brightness, brightness + 0.1);
      });

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 1.2,
        vertexColors: true,
        transparent: true,
        opacity: 0.9
      });

      starMesh = new THREE.Points(geometry, material);
      scene.add(starMesh);
    }

    // 4. アニメーションループ（モードに応じて処理を切替）
    function animate() {
      requestAnimationFrame(animate);

      if (isManualMode) {
        controls.update(); // 手動操作の更新
      } else {
        camera.quaternion.slerp(targetQuaternion, 0.1); // センサー追従
      }

      renderer.render(scene, camera);
    }

    // 5. ジャイロセンサー処理
    function onDeviceOrientation(event) {
      if (event.alpha === null || isManualMode) return;

      const alpha = THREE.MathUtils.degToRad(event.alpha || 0);
      const beta  = THREE.MathUtils.degToRad(event.beta || 0);
      const gamma = THREE.MathUtils.degToRad(event.gamma || 0);
      const orient = THREE.MathUtils.degToRad(window.orientation || 0);

      euler.set(beta, alpha, -gamma, 'YXZ');
      targetQuaternion.setFromEuler(euler);
      targetQuaternion.multiply(q1);

      q0.setFromAxisAngle(zee, -orient);
      targetQuaternion.multiply(q0);
    }

    // 6. 手動/センサー 切り替え処理
    modeBtn.addEventListener('click', () => {
      isManualMode = !isManualMode;

      if (isManualMode) {
        controls.enabled = true;
        modeBtn.innerText = "👆 手動操作中";
        sensorEl.innerText = "モード: 手動ドラッグ";
      } else {
        controls.enabled = false;
        modeBtn.innerText = "🧭 センサー連動中";
        sensorEl.innerText = "モード: センサー連動";
      }
    });

    // 7. 開始処理
    document.getElementById('start-btn').addEventListener('click', async () => {
      document.getElementById('overlay').style.display = 'none';
      modeBtn.style.display = 'block'; // スタート後に切り替えボタンを表示

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLat = pos.coords.latitude;
            userLon = pos.coords.longitude;
            locationEl.innerText = `現在地: 北緯${userLat.toFixed(2)}° 東経${userLon.toFixed(2)}°`;
            initThree();
            animate();
          },
          (err) => {
            locationEl.innerText = "位置情報: 取得失敗 (デフォルト東京)";
            initThree();
            animate();
          }
        );
      } else {
        initThree();
        animate();
      }

      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const state = await DeviceOrientationEvent.requestPermission();
          if (state === 'granted') {
            window.addEventListener('deviceorientation', onDeviceOrientation, false);
          }
        } catch (e) { console.error(e); }
      } else {
        window.addEventListener('deviceorientation', onDeviceOrientation, false);
      }
    });
  </script>
</body>
</html>
