<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイムAR星空オルゴール</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    canvas { display: block; }
    
    .material-symbols-outlined {
      font-size: 20px;
      vertical-align: middle;
      user-select: none;
    }

    #info { position: absolute; top: 10px; left: 10px; font-size: 12px; color: rgba(255,255,255,0.8); z-index: 5; line-height: 1.5; pointer-events: none; }

    #sidebar-toggle {
      position: absolute; top: 12px; right: 12px; z-index: 30;
      width: 44px; height: 44px; background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; color: white;
      cursor: pointer; display: flex; justify-content: center; align-items: center;
    }

    #sidebar {
      position: absolute; top: 0; right: -300px; width: 300px; height: 100%;
      background: rgba(10, 15, 30, 0.9); backdrop-filter: blur(12px);
      z-index: 25; transition: right 0.3s ease; padding: 60px 20px 20px; box-sizing: border-box;
      border-left: 1px solid rgba(255,255,255,0.1);
      display: flex; flex-direction: column;
    }
    #sidebar.open { right: 0; }

    .sidebar-header {
      font-size: 18px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
    }

    .setting-item {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; font-size: 14px;
    }

    .switch {
      position: relative; display: inline-block; width: 52px; height: 30px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #b0c4de; transition: .3s; border-radius: 30px;
    }
    .slider:before {
      position: absolute; content: ""; height: 24px; width: 24px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    input:checked + .slider { background-color: #2563eb; }
    input:checked + .slider:before { transform: translateX(22px); }

    .section-label {
      font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
    }
    #city-list {
      flex: 1; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; background: rgba(0,0,0,0.2);
    }
    .city-item {
      padding: 12px 16px; font-size: 14px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex; justify-content: space-between; align-items: center; transition: background 0.2s;
    }
    .city-item:last-child { border-bottom: none; }
    .city-item:hover { background: rgba(255,255,255,0.1); }
    .city-item.active { background: rgba(37, 99, 235, 0.3); color: #60a5fa; font-weight: bold; }
  </style>
</head>
<body>

  <div id="info">
    <div id="location-info">観測地: 東京</div>
    <div id="sensor-info">モード: センサー連動中</div>
  </div>

  <button id="sidebar-toggle">
    <span class="material-symbols-outlined" id="toggle-icon">settings</span>
  </button>

  <div id="sidebar">
    <div class="sidebar-header">
      <span class="material-symbols-outlined">settings</span> 設定
    </div>
    
    <div class="setting-item">
      <span>手動操作モード</span>
      <label class="switch">
        <input type="checkbox" id="manual-toggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="section-label">
      <span class="material-symbols-outlined">location_on</span> 観測地点を選択
    </div>
    <div id="city-list"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    let scene, camera, renderer, starMesh, controls;
    let userLat = 35.6812, userLon = 139.7671;
    let cityName = "東京";
    const locationEl = document.getElementById('location-info');
    const sensorEl = document.getElementById('sensor-info');

    let isManualMode = false;
    let realStarsData = [];
    let solarSystemGroup = new THREE.Group();

    const targetQuaternion = new THREE.Quaternion();
    const currentQuaternion = new THREE.Quaternion();
    const zee = new THREE.Vector3(0, 0, 1);
    const euler = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

    const cities = [
      { name: "現在地 (GPS)", lat: null, lon: null, isGps: true },
      { name: "札幌", lat: 43.0618, lon: 141.3545 },
      { name: "仙台 (宮城)", lat: 38.2682, lon: 140.8694 },
      { name: "東京", lat: 35.6812, lon: 139.7671 },
      { name: "名古屋 (愛知)", lat: 35.1815, lon: 136.9064 },
      { name: "大阪", lat: 34.6937, lon: 135.5023 },
      { name: "福岡", lat: 33.5902, lon: 130.4017 },
      { name: "那覇 (沖縄)", lat: 26.2123, lon: 127.6792 },
      { name: "ニューヨーク", lat: 40.7128, lon: -74.0060 },
      { name: "ロンドン", lat: 51.5074, lon: -0.1278 },
      { name: "パリ", lat: 48.8566, lon: 2.3522 },
      { name: "シドニー", lat: -33.8688, lon: 151.2093 },
      { name: "ホノルル", lat: 21.3069, lon: -157.8583 }
    ];

    async function loadRealStarCatalog() {
      try {
        const response = await fetch('https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/data/stars.6.json');
        const data = await response.json();
        
        realStarsData = data.features.map(f => {
          const coords = f.geometry.coordinates;
          const mag = f.properties.mag;
          const bv = f.properties.bv || 0.4;

          let color = new THREE.Color(0xffffff);
          if (bv < 0.0) color.setHex(0x9bb0ff);
          else if (bv < 0.4) color.setHex(0xcad8ff);
          else if (bv < 0.8) color.setHex(0xffffff);
          else if (bv < 1.2) color.setHex(0xffdd85);
          else color.setHex(0xffa050);

          return {
            ra: coords[0] / 15,
            dec: coords[1],
            mag: mag,
            color: color
          };
        });

        buildRealStarField();
      } catch (e) {
        console.error("星データの読み込みに失敗しました:", e);
      }
    }

    function raDecToAltAz(raHours, decDeg, latDeg, lonDeg, date) {
      const dec = decDeg * (Math.PI / 180);
      const lat = latDeg * (Math.PI / 180);
      const d = (date.getTime() / 86400000) - 10957.5;
      const gmst = (18.697374558 + 24.06570982441908 * d) % 24;
      const lst = (gmst + lonDeg / 15 + 24) % 24;
      const ha = (lst - raHours) * 15 * (Math.PI / 180);
      const sinAlt = Math.sin(dec) * Math.sin(lat) + Math.cos(dec) * Math.cos(lat) * Math.cos(ha);
      const alt = Math.asin(sinAlt);
      const cosAz = (Math.sin(dec) - Math.sin(alt) * Math.sin(lat)) / (Math.cos(alt) * Math.cos(lat));
      let az = Math.acos(Math.max(-1, Math.min(1, cosAz)));
      if (Math.sin(ha) > 0) az = 2 * Math.PI - az;
      return { alt: alt, az: az };
    }

    function rev(deg) {
      return deg - Math.floor(deg / 360.0) * 360.0;
    }

    function getSolarSystemPositions(date) {
      const d = (date.getTime() / 86400000) - 10957.5;
      const rad = Math.PI / 180;
      const deg = 180 / Math.PI;

      const ecl = 23.4393 - 3.563E-7 * d;
      const eclRad = ecl * rad;

      const w_sun = 282.9404 + 4.70935E-5 * d;
      const e_sun = 0.016709 - 1.151E-9 * d;
      const M_sun = rev(356.0470 + 0.9856002585 * d);
      const E_sun = M_sun + e_sun * deg * Math.sin(M_sun * rad) * (1 + e_sun * Math.cos(M_sun * rad));
      const xv_sun = Math.cos(E_sun * rad) - e_sun;
      const yv_sun = Math.sqrt(1.0 - e_sun * e_sun) * Math.sin(E_sun * rad);
      const r_sun = Math.sqrt(xv_sun * xv_sun + yv_sun * yv_sun);
      const v_sun = Math.atan2(yv_sun, xv_sun) * deg;
      const lon_sun = rev(v_sun + w_sun);

      const xs = r_sun * Math.cos(lon_sun * rad);
      const ys = r_sun * Math.sin(lon_sun * rad);

      const N_moon = rev(125.1228 - 0.0529538083 * d);
      const i_moon = 5.1454;
      const w_moon = rev(318.0634 + 0.1643573223 * d);
      const a_moon = 60.2666;
      const e_moon = 0.054900;
      const M_moon = rev(115.3654 + 13.0649929509 * d);

      const E_m = M_moon + e_moon * deg * Math.sin(M_moon * rad) * (1 + e_moon * Math.cos(M_moon * rad));
      const xv_m = a_moon * (Math.cos(E_m * rad) - e_moon);
      const yv_m = a_moon * Math.sqrt(1.0 - e_moon * e_moon) * Math.sin(E_m * rad);
      const v_m = Math.atan2(yv_m, xv_m) * deg;
      const r_m = Math.sqrt(xv_m * xv_m + yv_m * yv_m);

      const xh_m = r_m * (Math.cos(N_moon * rad) * Math.cos((v_m + w_moon) * rad) - Math.sin(N_moon * rad) * Math.sin((v_m + w_moon) * rad) * Math.cos(i_moon * rad));
      const yh_m = r_m * (Math.sin(N_moon * rad) * Math.cos((v_m + w_moon) * rad) + Math.cos(N_moon * rad) * Math.sin((v_m + w_moon) * rad) * Math.cos(i_moon * rad));
      const zh_m = r_m * (Math.sin((v_m + w_moon) * rad) * Math.sin(i_moon * rad));

      const moon_xe = xh_m;
      const moon_ye = yh_m * Math.cos(eclRad) - zh_m * Math.sin(eclRad);
      const moon_ze = yh_m * Math.sin(eclRad) + zh_m * Math.cos(eclRad);

      const moonRa = rev(Math.atan2(moon_ye, moon_xe) * deg) / 15;
      const moonDec = Math.atan2(moon_ze, Math.sqrt(moon_xe * moon_xe + moon_ye * moon_ye)) * deg;

      const sun_xe = xs;
      const sun_ye = ys * Math.cos(eclRad);
      const sun_ze = ys * Math.sin(eclRad);
      const sunRa = rev(Math.atan2(sun_ye, sun_xe) * deg) / 15;
      const sunDec = Math.atan2(sun_ze, Math.sqrt(sun_xe * sun_xe + sun_ye * sun_ye)) * deg;

      const bodies = [
        { name: "太陽", ra: sunRa, dec: sunDec, color: "#ffcc00", size: 5.5 },
        { name: "月",   ra: moonRa, dec: moonDec, color: "#ffffff", size: 4.5 }
      ];

      const planetsData = [
        { name: "水星", N: 48.3313 + 3.24587E-5*d, i: 7.0047 + 5.00E-8*d, w: 29.1241 + 1.01444E-5*d, a: 0.387098, e: 0.205635 + 5.59E-10*d, M: 168.6562 + 4.0923344368*d, color: "#b5a7a7", size: 2.2 },
        { name: "金星", N: 76.6799 + 2.46590E-5*d, i: 3.3946 + 2.75E-8*d, w: 54.8910 + 1.38374E-5*d, a: 0.723330, e: 0.006773 - 1.302E-9*d, M: 48.0052 + 1.6021302244*d, color: "#ffd700", size: 3.5 },
        { name: "火星", N: 49.5574 + 2.11081E-5*d, i: 1.8497 - 1.78E-8*d, w: 286.5016 + 2.92961E-5*d, a: 1.523688, e: 0.093405 + 2.516E-9*d, M: 18.6021 + 0.5240207766*d, color: "#ff4500", size: 3.0 },
        { name: "木星", N: 100.4542 + 2.76854E-5*d, i: 1.3030 - 1.557E-7*d, w: 273.8777 + 1.64505E-5*d, a: 5.20256, e: 0.048498 + 4.469E-9*d, M: 19.8950 + 0.0830853001*d, color: "#ffa500", size: 4.2 },
        { name: "土星", N: 113.6655 + 2.38980E-5*d, i: 2.4886 - 1.081E-7*d, w: 339.3939 + 2.97661E-5*d, a: 9.55475, e: 0.055546 - 9.499E-9*d, M: 316.9670 + 0.0334442282*d, color: "#f4a460", size: 3.8 },
        { name: "天王星", N: 74.0005 + 1.3978E-5*d, i: 0.7733 + 1.9E-8*d, w: 96.6612 + 3.0565E-5*d, a: 19.18171 - 1.55E-8*d, e: 0.047318 + 7.45E-9*d, M: 142.5905 + 0.011725806*d, color: "#7fffd4", size: 2.5 },
        { name: "海王星", N: 131.7806 + 3.0173E-5*d, i: 1.7700 - 2.55E-7*d, w: 272.8461 - 6.027E-6*d, a: 30.05826 + 3.313E-8*d, e: 0.008606 + 2.15E-9*d, M: 260.2471 + 0.005995147*d, color: "#4169e1", size: 2.5 }
      ];

      planetsData.forEach(p => {
        const N = rev(p.N);
        const i = p.i;
        const w = rev(p.w);
        const a = p.a;
        const e = p.e;
        const M = rev(p.M);

        let E = M + e * deg * Math.sin(M * rad) * (1 + e * Math.cos(M * rad));
        for (let k = 0; k < 3; k++) {
          E = E - (E - e * deg * Math.sin(E * rad) - M) / (1 - e * Math.cos(E * rad));
        }

        const xv = a * (Math.cos(E * rad) - e);
        const yv = a * Math.sqrt(1.0 - e * e) * Math.sin(E * rad);

        const v = Math.atan2(yv, xv) * deg;
        const r = Math.sqrt(xv * xv + yv * yv);

        const xh = r * (Math.cos(N * rad) * Math.cos((v + w) * rad) - Math.sin(N * rad) * Math.sin((v + w) * rad) * Math.cos(i * rad));
        const yh = r * (Math.sin(N * rad) * Math.cos((v + w) * rad) + Math.cos(N * rad) * Math.sin((v + w) * rad) * Math.cos(i * rad));
        const zh = r * (Math.sin((v + w) * rad) * Math.sin(i * rad));

        const xg = xh + xs;
        const yg = yh + ys;
        const zg = zh;

        const xe = xg;
        const ye = yg * Math.cos(eclRad) - zg * Math.sin(eclRad);
        const ze = yg * Math.sin(eclRad) + zg * Math.cos(eclRad);

        const ra = rev(Math.atan2(ye, xe) * deg) / 15;
        const dec = Math.atan2(ze, Math.sqrt(xe * xe + ye * ye)) * deg;

        bodies.push({
          name: p.name,
          ra: ra,
          dec: dec,
          color: p.color,
          size: p.size
        });
      });

      return bodies;
    }

    function createTextSprite(text, colorCss) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(16, 24, 224, 80, 16);
        ctx.fill();
        ctx.strokeStyle = colorCss;
        ctx.lineWidth = 4;
        ctx.stroke();
      } else {
        ctx.fillRect(16, 24, 224, 80);
      }

      ctx.font = 'Bold 42px sans-serif';
      ctx.fillStyle = colorCss;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 64);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(6, 3, 1);
      return sprite;
    }

    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0.1);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableZoom = false;
      controls.enablePan = false;
      controls.rotateSpeed = -0.5;
      controls.enabled = false;

      scene.add(solarSystemGroup);

      loadRealStarCatalog();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function buildRealStarField() {
      if (!realStarsData.length) return;
      if (starMesh) scene.remove(starMesh);

      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const colors = [];
      const now = new Date();
      const radius = 100;

      realStarsData.forEach(star => {
        const pos = raDecToAltAz(star.ra, star.dec, userLat, userLon, now);

        const x = radius * Math.cos(pos.alt) * Math.sin(pos.az);
        const y = radius * Math.sin(pos.alt);
        const z = -radius * Math.cos(pos.alt) * Math.cos(pos.az);
        positions.push(x, y, z);

        const brightness = Math.max(0.15, Math.min(1.0, 1 - (star.mag / 6.0)));
        const c = star.color;
        colors.push(c.r * brightness, c.g * brightness, c.b * brightness);
      });

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.7,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        sizeAttenuation: false
      });
      
      starMesh = new THREE.Points(geometry, material);
      scene.add(starMesh);

      buildSolarSystem(now);
    }

    function buildSolarSystem(date) {
      while (solarSystemGroup.children.length > 0) {
        const obj = solarSystemGroup.children[0];
        solarSystemGroup.remove(obj);
      }

      const radius = 95;
      const bodies = getSolarSystemPositions(date);

      bodies.forEach(body => {
        const pos = raDecToAltAz(body.ra, body.dec, userLat, userLon, date);

        const x = radius * Math.cos(pos.alt) * Math.sin(pos.az);
        const y = radius * Math.sin(pos.alt);
        const z = -radius * Math.cos(pos.alt) * Math.cos(pos.az);

        const sphereGeo = new THREE.SphereGeometry(body.size * 0.3, 16, 16);
        const sphereMat = new THREE.MeshBasicMaterial({ color: body.color });
        const mesh = new THREE.Mesh(sphereGeo, sphereMat);
        mesh.position.set(x, y, z);
        solarSystemGroup.add(mesh);

        const label = createTextSprite(body.name, body.color);
        label.position.set(x, y + (body.size * 0.4 + 2.0), z);
        solarSystemGroup.add(label);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      if (isManualMode) {
        controls.update();
      } else {
        camera.quaternion.slerp(targetQuaternion, 0.2);
      }
      renderer.render(scene, camera);
    }

    function onDeviceOrientation(event) {
      if (isManualMode) return;

      let alpha = event.alpha || 0;
      if (event.webkitCompassHeading !== undefined) {
        alpha = 360 - event.webkitCompassHeading;
      }

      const alphaRad = THREE.MathUtils.degToRad(alpha);
      const betaRad  = THREE.MathUtils.degToRad(event.beta || 0);
      const gammaRad = THREE.MathUtils.degToRad(event.gamma || 0);
      const orient   = THREE.MathUtils.degToRad(window.orientation || 0);

      euler.set(betaRad, alphaRad, -gammaRad, 'YXZ');
      targetQuaternion.setFromEuler(euler);
      targetQuaternion.multiply(q1);
      q0.setFromAxisAngle(zee, -orient);
      targetQuaternion.multiply(q0);
    }

    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const toggleIcon = document.getElementById('toggle-icon');
    const manualToggle = document.getElementById('manual-toggle');
    const cityListEl = document.getElementById('city-list');

    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      const isOpen = sidebar.classList.contains('open');
      toggleIcon.innerText = isOpen ? 'close' : 'settings';
    });

    manualToggle.addEventListener('change', (e) => {
      isManualMode = e.target.checked;
      controls.enabled = isManualMode;
      sensorEl.innerText = isManualMode ? "モード: 手動ドラッグ" : "モード: センサー連動";
    });

    function renderCityList() {
      cityListEl.innerHTML = '';
      cities.forEach(city => {
        const item = document.createElement('div');
        item.className = `city-item ${cityName === city.name ? 'active' : ''}`;
        
        let iconHtml = city.isGps ? '<span class="material-symbols-outlined" style="font-size:16px;">near_me</span>' : '';
        item.innerHTML = `<span>${city.name}</span> ${iconHtml}`;

        item.addEventListener('click', () => {
          if (city.isGps) {
            fetchGpsLocation();
          } else {
            userLat = city.lat;
            userLon = city.lon;
            cityName = city.name;
            locationEl.innerText = `観測地: ${cityName} (北緯${userLat.toFixed(1)}° 東経${userLon.toFixed(1)}°)`;
            buildRealStarField();
            renderCityList();
          }
        });

        cityListEl.appendChild(item);
      });
    }

    function fetchGpsLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLat = pos.coords.latitude;
            userLon = pos.coords.longitude;
            cityName = "現在地 (GPS)";
            locationEl.innerText = `観測地: 現在地 (北緯${userLat.toFixed(2)}° 東経${userLon.toFixed(2)}°)`;
            buildRealStarField();
            renderCityList();
          },
          (err) => {
            console.log("GPS取得スキップ（デフォルト位置で表示中）");
          }
        );
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initThree();
      animate();
      renderCityList();
      fetchGpsLocation();

      if (typeof DeviceOrientationEvent !== 'undefined') {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          window.addEventListener('click', async () => {
            try {
              const state = await DeviceOrientationEvent.requestPermission();
              if (state === 'granted') {
                window.addEventListener('deviceorientation', onDeviceOrientation, false);
              }
            } catch (e) {}
          }, { once: true });
        } else {
          window.addEventListener('deviceorientation', onDeviceOrientation, false);
        }
      }
    });
  </script>
