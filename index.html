<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>リアルタイムAR星空オルゴール</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; touch-action: none; user-select: none; }
    canvas { display: block; }
    .material-symbols-outlined { font-size: 20px; vertical-align: middle; user-select: none; }
    #info { position: absolute; top: 10px; left: 10px; right: 180px; font-size: 12px; color: rgba(255,255,255,0.9); z-index: 5; line-height: 1.5; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    #save-btn { position: absolute; top: 12px; right: 116px; z-index: 30; width: 44px; height: 44px; background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.4); border-radius: 50%; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; pointer-events: auto; box-shadow: 0 2px 6px rgba(0,0,0,0.5); transition: transform 0.2s; }
    #save-btn:active { transform: scale(0.92); }
    #reload-btn { position: absolute; top: 12px; right: 64px; z-index: 30; width: 44px; height: 44px; background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.4); border-radius: 50%; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; pointer-events: auto; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
    #sidebar-toggle { position: absolute; top: 12px; right: 12px; z-index: 30; width: 44px; height: 44px; background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.4); border-radius: 50%; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
    #sidebar { position: absolute; top: 0; right: 0; width: 320px; height: 100%; background: rgba(10, 15, 30, 0.95); backdrop-filter: blur(12px); z-index: 25; padding: 60px 20px 20px; box-sizing: border-box; border-left: 1px solid rgba(255,255,255,0.15); display: none; opacity: 0; transform: translateX(100%); transition: opacity 0.25s ease, transform 0.25s ease; flex-direction: column; overflow-y: auto; }
    #sidebar.open { display: flex; opacity: 1; transform: translateX(0); }
    .sidebar-header { font-size: 18px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .setting-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 14px; }
    .switch { position: relative; display: inline-block; width: 52px; height: 30px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #b0c4de; transition: .3s; border-radius: 30px; }
    .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    input:checked + .slider { background-color: #2563eb; }
    input:checked + .slider:before { transform: translateX(22px); }
    .accordion-header { font-size: 13px; color: rgba(255,255,255,0.9); margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(255,255,255,0.08); border-radius: 8px; }
    .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; border-radius: 8px; background: rgba(0,0,0,0.3); }
    .accordion-content.open { max-height: 240px; overflow-y: auto; margin-bottom: 15px; }
    #city-list { border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; }
    .city-item { padding: 10px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
    .city-item:last-child { border-bottom: none; }
    .city-item:hover { background: rgba(255,255,255,0.15); }
    .city-item.active { background: rgba(37, 99, 235, 0.4); color: #93c5fd; font-weight: bold; }
    select { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 4px 8px; border-radius: 4px; outline: none; }
    select option { background: #0a0f1e; color: white; }
    .library-item { background: rgba(255,255,255,0.08); border-radius: 8px; padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; border: 1px solid rgba(255,255,255,0.1); transition: background 0.2s, border-color 0.2s; }
    .library-item.playing { border-color: rgba(255, 215, 0, 0.8); background: rgba(255, 215, 0, 0.15); }
    .library-info { display: flex; flex-direction: column; gap: 2px; }
    .library-title { font-size: 13px; font-weight: bold; color: #fff; }
    .library-sub { font-size: 11px; color: rgba(255,255,255,0.6); }
    .library-actions { display: flex; gap: 6px; }
    .lib-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.15); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .lib-btn:hover { background: rgba(255,255,255,0.3); }
    .lib-btn.play-btn.playing { background: #f59e0b; border-color: #fbbf24; color: #000; }
    .lib-btn.delete-btn:hover { background: rgba(239, 68, 68, 0.4); border-color: #ef4444; }
    .thumb-container { position: relative; width: 100%; height: 130px; border-radius: 6px; overflow: hidden; background: #000; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
    .thumb-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #image-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; }
    #image-modal.active { display: flex; }
    #modal-img { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 8px; }
  </style>
</head>
<body>

  <div id="info">
    <div id="location-info">観測地: 現在地を取得中...</div>
    <div id="sensor-info">モード: 画面タップで方位固定・連動</div>
  </div>

  <button id="save-btn" title="現在の星空を保存 (最大5枚)">
    <span class="material-symbols-outlined">star</span>
  </button>
  <button id="reload-btn" title="方角・位置を再取得">
    <span class="material-symbols-outlined">refresh</span>
  </button>
  <button id="sidebar-toggle" title="設定">
    <span class="material-symbols-outlined" id="toggle-icon">settings</span>
  </button>

  <div id="sidebar">
    <div class="sidebar-header"><span class="material-symbols-outlined">settings</span> 設定</div>
    <div class="setting-item">
      <span>音色タイプ</span>
      <select id="timbre-select">
        <option value="kalimba">カリンバ (入眠用)</option>
        <option value="piano">ピアノ</option>
        <option value="synth">シンセパッド</option>
      </select>
    </div>
    <div class="setting-item">
      <span>手動操作モード</span>
      <label class="switch">
        <input type="checkbox" id="manual-toggle">
        <span class="slider"></span>
      </label>
    </div>
    <div class="setting-item">
      <span>星座線を表示</span>
      <label class="switch">
        <input type="checkbox" id="constellation-toggle">
        <span class="slider"></span>
      </label>
    </div>
    <div class="accordion-header" id="city-accordion-btn">
      <span style="display:flex; align-items:center; gap:6px;">
        <span class="material-symbols-outlined">location_on</span> 観測地点を選択
      </span>
      <span class="material-symbols-outlined" id="accordion-arrow">expand_more</span>
    </div>
    <div class="accordion-content" id="city-accordion-content"><div id="city-list"></div></div>
    <hr style="border:0; border-top: 1px solid rgba(255,255,255,0.15); margin: 20px 0;">
    <div class="sidebar-header" style="font-size: 16px;">
      <span class="material-symbols-outlined">photo_library</span> 星空ライブラリ (最大5枚)
    </div>
    <div id="library-list"></div>
  </div>

  <div id="image-modal"><img id="modal-img" src="" alt="拡大画像"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    let scene, camera, renderer, starMesh, orbitControls;
    let userLat = 35.6812, userLon = 139.7671;
    let cityName = "現在地（GPS）";
    const locationEl = document.getElementById('location-info');
    const sensorEl = document.getElementById('sensor-info');

    let isManualMode = false;
    let showConstellations = false;
    let realStarsData = [];
    let constellationLinesData = [];
    let constellationPointsList = [];
    let solarSystemGroup = new THREE.Group();
    let constellationGroup = new THREE.Group();
    let lastCalcTime = 0;

    let deviceAlpha = 0, deviceBeta = 0, deviceGamma = 0;
    let headingOffset = 0; 
    let isHeadingInitialized = false;
    let screenOrientation = window.orientation || 0;

    let initialPinchDistance = null;
    let initialFov = 75;

    let audioCtx = null;
    let isPlayingMusic = false;
    let currentTimbre = 'kalimba';
    let currentPlayingId = null;
    let savedLibrary = [];

    let currentPlaybackList = [];
    let playbackStarIndex = 0;
    let nextNoteTime = 0;

    const fNaturalMinorScale = [
      174.61, 196.00, 207.65, 233.08, 261.63, 277.18, 311.13,
      349.23, 392.00, 415.30, 466.16, 523.25, 554.37, 622.25,
      698.46, 783.99, 830.61, 932.33, 1046.50, 1108.73, 1244.51,
      1396.91, 1567.98, 1661.22, 1864.66, 2093.00, 2217.46, 2489.02
    ];

    const cities = [
      { name: "東京", lat: 35.6812, lon: 139.7671 },
      { name: "札幌", lat: 43.0618, lon: 141.3545 },
      { name: "仙台 (宮城)", lat: 38.2682, lon: 140.8694 },
      { name: "名古屋 (愛知)", lat: 35.1815, lon: 136.9064 },
      { name: "大阪", lat: 34.6937, lon: 135.5023 },
      { name: "福岡", lat: 33.5902, lon: 130.4017 },
      { name: "那覇 (沖縄)", lat: 26.2123, lon: 127.6792 },
      { name: "ニューヨーク", lat: 40.7128, lon: -74.0060 },
      { name: "ロンドン", lat: 51.5074, lon: -0.1278 },
      { name: "パリ", lat: 48.8566, lon: 2.3522 },
      { name: "シドニー", lat: -33.8688, lon: 151.2093 },
      { name: "ホノルル", lat: 21.3069, lon: -157.8583 }
    ];

    function clearGroup(group) {
      while (group.children.length > 0) {
        const child = group.children[0];
        group.remove(child);
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (Array.isArray(child.material)) {
            child.material.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
          } else {
            if (child.material.map) child.material.map.dispose();
            child.material.dispose();
          }
        }
      }
    }

    function createStarTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 128, 128);

      const coreGrad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      coreGrad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      coreGrad.addColorStop(0.15, 'rgba(255, 255, 255, 0.95)');
      coreGrad.addColorStop(0.4, 'rgba(230, 240, 255, 0.5)');
      coreGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
      ctx.fillStyle = coreGrad;
      ctx.beginPath(); ctx.arc(64, 64, 64, 0, Math.PI * 2); ctx.fill();

      const flareGrad = ctx.createLinearGradient(0, 64, 128, 64);
      flareGrad.addColorStop(0.0, 'rgba(255, 255, 255, 0)');
      flareGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.85)');
      flareGrad.addColorStop(1.0, 'rgba(255, 255, 255, 0)');

      ctx.fillStyle = flareGrad;
      ctx.fillRect(0, 62, 128, 4);

      ctx.save();
      ctx.translate(64, 64);
      ctx.rotate(Math.PI / 2);
      ctx.translate(-64, -64);
      ctx.fillRect(0, 62, 128, 4);
      ctx.restore();

      return new THREE.CanvasTexture(canvas);
    }

    async function loadRealStarCatalog() {
      try {
        const [starsRes, constRes] = await Promise.all([
          fetch('https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/data/stars.8.json'),
          fetch('https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/data/constellations.lines.json')
        ]);
        
        const starsData = await starsRes.json();
        const constData = await constRes.json();

        constellationLinesData = constData.features;

        constellationPointsList = [];
        constellationLinesData.forEach(feature => {
          const geometry = feature.geometry;
          const lines = geometry.type === 'MultiLineString' ? geometry.coordinates : [geometry.coordinates];
          lines.forEach(line => {
            line.forEach(pt => {
              const ra = pt[0] / 15;
              const dec = pt[1];
              constellationPointsList.push({ ra, dec });
            });
          });
        });

        const isPointNearConstellation = (ra, dec) => {
          for (let i = 0; i < constellationPointsList.length; i++) {
            const pt = constellationPointsList[i];
            const dRa = (ra - pt.ra) * 15 * Math.cos(dec * Math.PI / 180);
            const dDec = dec - pt.dec;
            const dist = Math.sqrt(dRa * dRa + dDec * dDec);
            if (dist < 0.8) return true;
          }
          return false;
        };

        realStarsData = starsData.features.map(f => {
          const coords = f.geometry.coordinates;
          const ra = coords[0] / 15;
          const dec = coords[1];
          const mag = f.properties.mag;
          const bv = f.properties.bv !== undefined ? f.properties.bv : 0.4;

          let color = new THREE.Color(0xffffff);
          if (bv < 0.0) color.setHex(0x9bb0ff);
          else if (bv < 0.4) color.setHex(0xcad8ff);
          else if (bv < 0.8) color.setHex(0xffffff);
          else if (bv < 1.2) color.setHex(0xffdd85);
          else color.setHex(0xffa050);

          const isConstellationStar = isPointNearConstellation(ra, dec);

          return { ra, dec, mag, bv, color, isConstellationStar };
        });

        buildRealStarField();
      } catch (e) {
        console.error("データの読み込みに失敗しました:", e);
      }
    }

    function raDecToAltAz(raHours, decDeg, latDeg, lonDeg, date) {
      const dec = decDeg * (Math.PI / 180);
      const lat = latDeg * (Math.PI / 180);
      const d = (date.getTime() / 86400000) - 10957.5;
      const gmst = (18.697374558 + 24.06570982441908 * d) % 24;
      const lst = (gmst + lonDeg / 15 + 24) % 24;
      const ha = (lst - raHours) * 15 * (Math.PI / 180);
      
      const sinAlt = Math.sin(dec) * Math.sin(lat) + Math.cos(dec) * Math.cos(lat) * Math.cos(ha);
      const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
      
      const cosAz = (Math.sin(dec) - Math.sin(alt) * Math.sin(lat)) / (Math.cos(alt) * Math.cos(lat));
      let az = Math.acos(Math.max(-1, Math.min(1, cosAz)));
      if (Math.sin(ha) > 0) az = 2 * Math.PI - az;
      return { alt: alt, az: az };
    }

    function altAzToVector3(alt, az, radius) {
      const x = radius * Math.cos(alt) * Math.sin(az);
      const y = radius * Math.sin(alt);
      const z = -radius * Math.cos(alt) * Math.cos(az);
      return new THREE.Vector3(x, y, z);
    }

    function updateCanvasSize() {
      const width = window.visualViewport ? window.visualViewport.width : window.innerWidth;
      const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    function setupZoomControls() {
      const dom = renderer.domElement;
      const getDistance = (e) => {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      };

      dom.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          initialPinchDistance = getDistance(e);
          initialFov = camera.fov;
        }
      }, { passive: true });

      dom.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialPinchDistance !== null) {
          const currentDistance = getDistance(e);
          const factor = initialPinchDistance / currentDistance;
          camera.fov = Math.max(10, Math.min(100, initialFov * factor));
          camera.updateProjectionMatrix();
        }
      }, { passive: true });

      dom.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          initialPinchDistance = null;
        }
      }, { passive: true });

      dom.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSpeed = 0.05;
        camera.fov = Math.max(10, Math.min(100, camera.fov + e.deltaY * zoomSpeed));
        camera.updateProjectionMatrix();
      }, { passive: false });
    }

    function initThree() {
      const initialWidth = window.visualViewport ? window.visualViewport.width : window.innerWidth;
      const initialHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, initialWidth / initialHeight, 0.1, 1000);
      camera.position.set(0, 0, 0.1);

      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(initialWidth, initialHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
      document.body.appendChild(renderer.domElement);

      orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
      orbitControls.enableZoom = false;
      orbitControls.enablePan = false;
      orbitControls.rotateSpeed = -0.5;
      orbitControls.target.set(0, 0, 0);
      orbitControls.enabled = false;

      scene.add(solarSystemGroup);
      scene.add(constellationGroup);

      loadRealStarCatalog();
      setupSensorSync();
      setupZoomControls();

      window.addEventListener('resize', updateCanvasSize);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateCanvasSize);
      }
    }

    function setupSensorSync() {
      const handleOrientation = (e) => {
        if (isManualMode || isPlayingMusic) return;

        let alpha = e.alpha || 0;
        let beta = e.beta || 0;
        let gamma = e.gamma || 0;

        if (!isHeadingInitialized) {
          let compassHeading = null;
          if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
            compassHeading = 360 - e.webkitCompassHeading;
          } else if (e.absolute && e.alpha !== null) {
            compassHeading = e.alpha;
          }

          if (compassHeading !== null) {
            headingOffset = compassHeading - alpha;
            isHeadingInitialized = true;
            sensorEl.innerText = "モード: 初期方位を固定・スムーズジャイロ追従中";
          }
        }

        deviceAlpha = alpha + headingOffset;
        deviceBeta = beta;
        deviceGamma = gamma;
      };

      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
      window.addEventListener('deviceorientation', handleOrientation, true);
    }

    const ze = new THREE.Vector3(0, 0, 1);
    const targetQuaternion = new THREE.Quaternion();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

    function updateCameraOrientation() {
      if (isManualMode || isPlayingMusic) return;

      const alpha = THREE.MathUtils.degToRad(deviceAlpha);
      const beta = THREE.MathUtils.degToRad(deviceBeta);
      const gamma = THREE.MathUtils.degToRad(deviceGamma);
      const orient = THREE.MathUtils.degToRad(screenOrientation || 0);

      const qx = new THREE.Quaternion();
      const qy = new THREE.Quaternion();
      const qz = new THREE.Quaternion();

      qy.setFromAxisAngle(new THREE.Vector3(0, 1, 0), alpha);
      qx.setFromAxisAngle(new THREE.Vector3(1, 0, 0), beta);
      qz.setFromAxisAngle(ze, -gamma);

      targetQuaternion.copy(qy);
      targetQuaternion.multiply(qx);
      targetQuaternion.multiply(qz);

      targetQuaternion.multiply(q1);
      targetQuaternion.multiply(q0.setFromAxisAngle(ze, -orient));

      camera.quaternion.slerp(targetQuaternion, 0.2);
    }

    function requestSensorPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') sensorEl.innerText = "モード: ジャイロ連動中";
        }).catch(() => {});
      }
    }

    function getExactStarSize(mag, isConstellationStar) {
      if (isConstellationStar) {
        if (mag < 2.5) return 9.0;
        if (mag < 3.5) return 7.0;
        return 4.0;
      }
      if (mag <= -1.5) return 30.0;
      if (mag >= 8.5) return 2.0;
      return 2.0 + (8.5 - mag) * 1.5;
    }

    function buildRealStarField() {
      if (!realStarsData.length) return;
      
      if (starMesh) {
        scene.remove(starMesh);
        if (starMesh.geometry) starMesh.geometry.dispose();
        if (starMesh.material) starMesh.material.dispose();
        starMesh = null;
      }

      const geometry = new THREE.BufferGeometry();
      const positions = [], colors = [], sizes = [], opacities = [], mags = [], flashBoosts = [];
      const now = new Date();
      const radius = 100;

      realStarsData.forEach(star => {
        const pos = raDecToAltAz(star.ra, star.dec, userLat, userLon, now);
        const vec = altAzToVector3(pos.alt, pos.az, radius);
        positions.push(vec.x, vec.y, vec.z);

        const c = star.color;
        colors.push(c.r, c.g, c.b);

        const starSize = getExactStarSize(star.mag, star.isConstellationStar);
        sizes.push(starSize);

        const normMag = Math.max(-1.5, Math.min(8.5, star.mag));
        const magRatio = 1.0 - (normMag + 1.5) / 10.0;
        let baseOpacity = 0.50 + Math.pow(magRatio, 1.5) * 0.50;

        opacities.push(baseOpacity);
        mags.push(star.mag);
        flashBoosts.push(0.0);
      });

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));
      geometry.setAttribute('aOpacity', new THREE.Float32BufferAttribute(opacities, 1));
      geometry.setAttribute('aMag', new THREE.Float32BufferAttribute(mags, 1));
      geometry.setAttribute('aFlash', new THREE.Float32BufferAttribute(flashBoosts, 1));

      const shaderMaterial = new THREE.ShaderMaterial({
        uniforms: { 
          pointTexture: { value: createStarTexture() },
          uFov: { value: camera.fov }
        },
        vertexShader: `
          attribute float aSize;
          attribute float aOpacity;
          attribute float aMag;
          attribute float aFlash;
          uniform float uFov;
          varying vec3 vColor;
          varying float vOpacity;
          
          void main() {
            vColor = mix(color, vec3(1.0, 1.0, 1.0), aFlash * 0.7);
            float zoomFactor = smoothstep(75.0, 20.0, uFov);
            vOpacity = (aMag > 5.0) ? (aOpacity + aFlash * 0.5) * zoomFactor : min(1.0, aOpacity + aFlash * 0.5);
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            float currentSize = aSize * (1.0 + aFlash * 2.5);
            gl_PointSize = currentSize * (180.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform sampler2D pointTexture;
          varying vec3 vColor;
          varying float vOpacity;
          
          void main() {
            if (vOpacity <= 0.005) discard;
            vec4 texColor = texture2D(pointTexture, gl_PointCoord);
            gl_FragColor = vec4(vColor, vOpacity) * texColor;
          }
        `,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      
      starMesh = new THREE.Points(geometry, shaderMaterial);
      scene.add(starMesh);
    }

    function fetchCurrentLocation() {
      locationEl.innerText = `観測地: 現在地を取得中...`;
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            userLat = position.coords.latitude;
            userLon = position.coords.longitude;
            cityName = "現在地（GPS）";
            locationEl.innerText = `観測地: ${cityName}`;
            if (realStarsData.length > 0) buildRealStarField();
          },
          () => {
            userLat = 35.6812; userLon = 139.7671; cityName = "東京 (デフォルト)";
            locationEl.innerText = `観測地: ${cityName}`;
            if (realStarsData.length > 0) buildRealStarField();
          }
        );
      }
    }

    function initAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function scheduleStarSound(freq, volume, startTime) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      const duration = currentTimbre === 'synth' ? 2.5 : 1.8;

      osc.frequency.setValueAtTime(freq, startTime);
      osc.type = currentTimbre === 'piano' ? 'triangle' : 'sine';

      gainNode.gain.setValueAtTime(0.0001, startTime);
      gainNode.gain.linearRampToValueAtTime(volume * 0.4, startTime + 0.01);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    function triggerStarFlash(starIndex) {
      if (!starMesh || !starMesh.geometry || !starMesh.geometry.attributes.aFlash) return;
      const flashArr = starMesh.geometry.attributes.aFlash.array;
      if (starIndex >= 0 && starIndex < flashArr.length) {
        flashArr[starIndex] = 1.0;
        starMesh.geometry.attributes.aFlash.needsUpdate = true;
      }
    }

    function triggerThumbnailFlash(itemId, normX, normY) {
      const canvas = document.getElementById(`thumb-canvas-${itemId}`);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
      }

      const x = normX * canvas.width;
      const y = normY * canvas.height;
      let radius = 2, opacity = 1.0;

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 220, ${opacity})`;
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 8;
        ctx.fill();
        radius += 1.2;
        opacity -= 0.08;
        if (opacity > 0) requestAnimationFrame(draw);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      draw();
    }

    function stopMusicPlayback() {
      isPlayingMusic = false;
      currentPlayingId = null;
      currentPlaybackList = [];
      renderLibrary();
    }

    function playLibraryItem(id) {
      initAudioContext();
      if (currentPlayingId === id) {
        stopMusicPlayback();
        return;
      }

      const item = savedLibrary.find(x => x.id === id);
      if (!item || !item.stars || item.stars.length === 0) return;

      isPlayingMusic = true;
      currentPlayingId = id;
      currentPlaybackList = [...item.stars];
      playbackStarIndex = 0;
      nextNoteTime = audioCtx.currentTime + 0.05;

      renderLibrary();
    }

    function updateAudioScheduler() {
      if (!isPlayingMusic || !audioCtx || !currentPlaybackList || currentPlaybackList.length === 0) return;

      if (nextNoteTime < audioCtx.currentTime) {
        nextNoteTime = audioCtx.currentTime + 0.05;
      }

      while (nextNoteTime < audioCtx.currentTime + 0.2) {
        const star = currentPlaybackList[playbackStarIndex];
        if (star) {
          const normMag = Math.max(-1.5, Math.min(8.5, star.mag));
          const volume = Math.max(0.25, 0.8 - ((normMag + 1.5) / 10.0) * 0.55);
          const clampedBv = Math.max(-0.3, Math.min(1.6, star.bv !== undefined ? star.bv : 0.4));
          const colorRatio = 1.0 - (clampedBv + 0.3) / 1.9;
          const scaleIndex = Math.floor(colorRatio * (fNaturalMinorScale.length - 1));
          const freq = fNaturalMinorScale[scaleIndex];

          scheduleStarSound(freq, volume, nextNoteTime);

          const delayMs = Math.max(0, (nextNoteTime - audioCtx.currentTime) * 1000);
          const pId = currentPlayingId;
          const nx = star.normX, ny = star.normY;

          setTimeout(() => {
            if (isPlayingMusic && currentPlayingId === pId) {
              triggerThumbnailFlash(pId, nx, ny);
              if (star.origIndex !== undefined) triggerStarFlash(star.origIndex);
            }
          }, delayMs);
        }

        nextNoteTime += 0.25 + Math.random() * 0.08;
        playbackStarIndex = (playbackStarIndex + 1) % currentPlaybackList.length;
      }
    }

    function animate(nowTime) {
      requestAnimationFrame(animate);
      updateAudioScheduler();

      if (isManualMode) {
        if (!isPlayingMusic) orbitControls.update();
      } else {
        updateCameraOrientation();
      }

      renderer.render(scene, camera);
    }

    function loadLibrary() {
      const data = localStorage.getItem('star_library_data');
      if (data) {
        try { savedLibrary = JSON.parse(data); } catch(e) { savedLibrary = []; }
      }
    }

    function saveLibraryToStorage() {
      localStorage.setItem('star_library_data', JSON.stringify(savedLibrary));
    }

    // 画像（サムネイル）上での上から下（normY: 0.0 -> 1.0）へ確実にソートして保存
    function saveCurrentStarfield() {
      if (savedLibrary.length >= 5) {
        alert("ライブラリには最大5枚までしか保存できません。");
        return;
      }

      // レンダリング直後に同期してカメラ座標を計算
      renderer.render(scene, camera);
      
      const posAttr = starMesh.geometry.attributes.position;
      const worldPos = new THREE.Vector3();
      const projVec = new THREE.Vector3();
      const visibleStars = [];

      for (let i = 0; i < realStarsData.length; i++) {
        worldPos.fromBufferAttribute(posAttr, i);
        projVec.copy(worldPos).project(camera);

        // 画面の撮影範囲内（-1 〜 +1）のみ抽出
        if (projVec.z < 1.0 && projVec.x >= -1.0 && projVec.x <= 1.0 && projVec.y >= -1.0 && projVec.y <= 1.0) {
          // 画像上の座標（normX: 0~1 左から右, normY: 0~1 上から下）
          const normX = (projVec.x + 1) / 2;
          const normY = (1 - projVec.y) / 2;

          visibleStars.push({
            origIndex: i,
            mag: realStarsData[i].mag,
            bv: realStarsData[i].bv,
            normX: normX,
            normY: normY
          });
        }
      }

      if (visibleStars.length === 0) {
        alert("視界内に保存できる星が見つかりません。");
        return;
      }

      // 画像上の上（normYが小さい）から下（normYが大きい）へと確実にソート
      visibleStars.sort((a, b) => a.normY - b.normY);

      const thumbnailData = renderer.domElement.toDataURL('image/jpeg', 0.6);
      const now = new Date();
      const timeStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      savedLibrary.push({
        id: Date.now().toString(),
        title: `${cityName}`,
        date: timeStr,
        image: thumbnailData,
        starCount: visibleStars.length,
        stars: visibleStars
      });

      saveLibraryToStorage();
      renderLibrary();

      document.getElementById('sidebar').classList.add('open');
      document.getElementById('toggle-icon').innerText = 'close';
      alert(`星空を保存しました！（演奏数: ${visibleStars.length}音）`);
    }

    function deleteLibraryItem(id) {
      if (currentPlayingId === id) stopMusicPlayback();
      savedLibrary = savedLibrary.filter(item => item.id !== id);
      saveLibraryToStorage();
      renderLibrary();
    }

    function renderLibrary() {
      const container = document.getElementById('library-list');
      if (!container) return;

      if (savedLibrary.length === 0) {
        container.innerHTML = `<div style="font-size:12px; color:rgba(255,255,255,0.5); text-align:center; padding:20px 0;">保存された星空はありません</div>`;
        return;
      }

      container.innerHTML = '';
      savedLibrary.forEach((item, index) => {
        const isPlaying = currentPlayingId === item.id;
        const div = document.createElement('div');
        div.className = `library-item ${isPlaying ? 'playing' : ''}`;
        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="library-info">
              <div class="library-title">No.${index + 1} ${item.title} (${item.starCount}音)</div>
              <div class="library-sub">${item.date}</div>
            </div>
            <div class="library-actions">
              <button class="lib-btn play-btn ${isPlaying ? 'playing' : ''}">
                <span class="material-symbols-outlined">${isPlaying ? 'pause' : 'music_note'}</span>
              </button>
              <button class="lib-btn delete-btn">
                <span class="material-symbols-outlined">delete</span>
              </button>
            </div>
          </div>
          <div class="thumb-container">
            <img class="thumb-img" src="${item.image || ''}">
            <canvas id="thumb-canvas-${item.id}" class="thumb-canvas"></canvas>
          </div>
        `;

        div.querySelector('.play-btn').addEventListener('click', () => playLibraryItem(item.id));
        div.querySelector('.delete-btn').addEventListener('click', () => deleteLibraryItem(item.id));
        container.appendChild(div);
      });
    }

    document.getElementById('save-btn').addEventListener('click', saveCurrentStarfield);
    document.getElementById('sidebar-toggle').addEventListener('click', () => {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('open');
      document.getElementById('toggle-icon').innerText = sb.classList.contains('open') ? 'close' : 'settings';
    });

    window.addEventListener('DOMContentLoaded', () => {
      initThree();
      loadLibrary();
      renderLibrary();
      requestAnimationFrame(animate);
      fetchCurrentLocation();
    });
  </script>
</body>
</html>
