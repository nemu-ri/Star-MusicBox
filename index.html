<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>リアルタイムAR星空オルゴール</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      touch-action: none;
      user-select: none;
    }
    canvas { display: block; }
    
    .material-symbols-outlined { font-size: 20px; vertical-align: middle; user-select: none; }

    #info { 
      position: absolute; top: 10px; left: 10px; right: 120px; 
      font-size: 12px; color: rgba(255,255,255,0.9); z-index: 5; 
      line-height: 1.5; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.8); 
    }

    #reload-btn {
      position: absolute; top: 12px; right: 64px; z-index: 30;
      width: 44px; height: 44px; background: rgba(255,255,255,0.2); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.4); border-radius: 50%; color: white;
      cursor: pointer; display: flex; justify-content: center; align-items: center;
      pointer-events: auto; box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    #sidebar-toggle {
      position: absolute; top: 12px; right: 12px; z-index: 30;
      width: 44px; height: 44px; background: rgba(255,255,255,0.2); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.4); border-radius: 50%; color: white;
      cursor: pointer; display: flex; justify-content: center; align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    #sidebar {
      position: absolute; top: 0; right: 0; width: 300px; height: 100%;
      background: rgba(10, 15, 30, 0.95); backdrop-filter: blur(12px);
      z-index: 25; padding: 60px 20px 20px; box-sizing: border-box;
      border-left: 1px solid rgba(255,255,255,0.15);
      display: none; opacity: 0; transform: translateX(100%);
      transition: opacity 0.25s ease, transform 0.25s ease;
      flex-direction: column; overflow-y: auto;
    }
    #sidebar.open { display: flex; opacity: 1; transform: translateX(0); }

    .sidebar-header { font-size: 18px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

    .setting-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 14px; }

    .switch { position: relative; display: inline-block; width: 52px; height: 30px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #b0c4de; transition: .3s; border-radius: 30px;
    }
    .slider:before {
      position: absolute; content: ""; height: 24px; width: 24px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    input:checked + .slider { background-color: #2563eb; }
    input:checked + .slider:before { transform: translateX(22px); }

    .accordion-header {
      font-size: 13px; color: rgba(255,255,255,0.9); margin-bottom: 8px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: rgba(255,255,255,0.08); border-radius: 8px;
    }
    .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; border-radius: 8px; background: rgba(0,0,0,0.3); }
    .accordion-content.open { max-height: 240px; overflow-y: auto; margin-bottom: 15px; }

    #city-list { border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; }
    .city-item {
      padding: 10px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; justify-content: space-between; align-items: center; transition: background 0.2s;
    }
    .city-item:last-child { border-bottom: none; }
    .city-item:hover { background: rgba(255,255,255,0.15); }
    .city-item.active { background: rgba(37, 99, 235, 0.4); color: #93c5fd; font-weight: bold; }
  </style>
</head>
<body>

  <div id="info">
    <div id="location-info">観測地: 現在地を取得中...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    let scene, camera, renderer, starMesh, orbitControls;
    let userLat = 35.6812, userLon = 139.7671;
    let cityName = "現在地（GPS）";
    const locationEl = document.getElementById('location-info');
    const sensorEl = document.getElementById('sensor-info');

    let isManualMode = false;
    let showConstellations = true;
    let realStarsData = [];
    let constellationLinesData = [];
    let constellationPointsList = [];
    let solarSystemGroup = new THREE.Group();
    let constellationGroup = new THREE.Group();
    let lastCalcTime = 0;

    let deviceAlpha = 0, deviceBeta = 0, deviceGamma = 0;
    let headingOffset = 0; 
    let isHeadingInitialized = false;
    let screenOrientation = window.orientation || 0;

    let initialPinchDistance = null;
    let initialFov = 75;

    const cities = [
      { name: "東京", lat: 35.6812, lon: 139.7671 },
      { name: "札幌", lat: 43.0618, lon: 141.3545 },
      { name: "仙台 (宮城)", lat: 38.2682, lon: 140.8694 },
      { name: "名古屋 (愛知)", lat: 35.1815, lon: 136.9064 },
      { name: "大阪", lat: 34.6937, lon: 135.5023 },
      { name: "福岡", lat: 33.5902, lon: 130.4017 },
      { name: "那覇 (沖縄)", lat: 26.2123, lon: 127.6792 },
      { name: "ニューヨーク", lat: 40.7128, lon: -74.0060 },
      { name: "ロンドン", lat: 51.5074, lon: -0.1278 },
      { name: "パリ", lat: 48.8566, lon: 2.3522 },
      { name: "シドニー", lat: -33.8688, lon: 151.2093 },
      { name: "ホノルル", lat: 21.3069, lon: -157.8583 }
    ];

    function createStarTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128; 
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 128, 128);

      const coreGrad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      coreGrad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      coreGrad.addColorStop(0.15, 'rgba(255, 255, 255, 0.95)');
      coreGrad.addColorStop(0.4, 'rgba(230, 240, 255, 0.5)');
      coreGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
      ctx.fillStyle = coreGrad;
      ctx.beginPath(); 
      ctx.arc(64, 64, 64, 0, Math.PI * 2); 
      ctx.fill();

      const flareGrad = ctx.createLinearGradient(0, 64, 128, 64);
      flareGrad.addColorStop(0.0, 'rgba(255, 255, 255, 0)');
      flareGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.85)');
      flareGrad.addColorStop(1.0, 'rgba(255, 255, 255, 0)');

      ctx.fillStyle = flareGrad;
      ctx.fillRect(0, 62, 128, 4);

      ctx.save();
      ctx.translate(64, 64);
      ctx.rotate(Math.PI / 2);
      ctx.translate(-64, -64);
      ctx.fillRect(0, 62, 128, 4);
      ctx.restore();

      return new THREE.CanvasTexture(canvas);
    }

    async function loadRealStarCatalog() {
      try {
        const [starsRes, constRes] = await Promise.all([
          fetch('https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/data/stars.8.json'),
          fetch('https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/data/constellations.lines.json')
        ]);
        
        const starsData = await starsRes.json();
        const constData = await constRes.json();

        constellationLinesData = constData.features;

        constellationPointsList = [];
        constellationLinesData.forEach(feature => {
          const geometry = feature.geometry;
          const lines = geometry.type === 'MultiLineString' ? geometry.coordinates : [geometry.coordinates];
          lines.forEach(line => {
            line.forEach(pt => {
              const ra = pt[0] / 15;
              const dec = pt[1];
              constellationPointsList.push({ ra, dec });
            });
          });
        });

        const isPointNearConstellation = (ra, dec) => {
          for (let i = 0; i < constellationPointsList.length; i++) {
            const pt = constellationPointsList[i];
            const dRa = (ra - pt.ra) * 15 * Math.cos(dec * Math.PI / 180);
            const dDec = dec - pt.dec;
            const dist = Math.sqrt(dRa * dRa + dDec * dDec);
            if (dist < 0.8) return true;
          }
          return false;
        };

        realStarsData = starsData.features.map(f => {
          const coords = f.geometry.coordinates;
          const ra = coords[0] / 15;
          const dec = coords[1];
          const mag = f.properties.mag;
          const bv = f.properties.bv || 0.4;

          let color = new THREE.Color(0xffffff);
          if (bv < 0.0) color.setHex(0x9bb0ff);
          else if (bv < 0.4) color.setHex(0xcad8ff);
          else if (bv < 0.8) color.setHex(0xffffff);
          else if (bv < 1.2) color.setHex(0xffdd85);
          else color.setHex(0xffa050);

          const isConstellationStar = isPointNearConstellation(ra, dec);

          return { ra, dec, mag, color, isConstellationStar };
        });

        buildRealStarField();
      } catch (e) {
        console.error("データの読み込みに失敗しました:", e);
      }
    }

    function raDecToAltAz(raHours, decDeg, latDeg, lonDeg, date) {
      const dec = decDeg * (Math.PI / 180);
      const lat = latDeg * (Math.PI / 180);
      const d = (date.getTime() / 86400000) - 10957.5;
      const gmst = (18.697374558 + 24.06570982441908 * d) % 24;
      const lst = (gmst + lonDeg / 15 + 24) % 24;
      const ha = (lst - raHours) * 15 * (Math.PI / 180);
      
      const sinAlt = Math.sin(dec) * Math.sin(lat) + Math.cos(dec) * Math.cos(lat) * Math.cos(ha);
      const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
      
      const cosAz = (Math.sin(dec) - Math.sin(alt) * Math.sin(lat)) / (Math.cos(alt) * Math.cos(lat));
      let az = Math.acos(Math.max(-1, Math.min(1, cosAz)));
      if (Math.sin(ha) > 0) az = 2 * Math.PI - az;
      return { alt: alt, az: az };
    }

    function altAzToVector3(alt, az, radius) {
      const x = radius * Math.cos(alt) * Math.sin(az);
      const y = radius * Math.sin(alt);
      const z = -radius * Math.cos(alt) * Math.cos(az);
      return new THREE.Vector3(x, y, z);
    }

    function rev(deg) { return deg - Math.floor(deg / 360.0) * 360.0; }

    function getSolarSystemPositions(date) {
      const d = (date.getTime() / 86400000) - 10957.5;
      const rad = Math.PI / 180;
      const deg = 180 / Math.PI;

      const ecl = 23.4393 - 3.563E-7 * d;
      const eclRad = ecl * rad;

      const w_sun = 282.9404 + 4.70935E-5 * d;
      const e_sun = 0.016709 - 1.151E-9 * d;
      const M_sun = rev(356.0470 + 0.9856002585 * d);
      const E_sun = M_sun + e_sun * deg * Math.sin(M_sun * rad) * (1 + e_sun * Math.cos(M_sun * rad));
      const xv_sun = Math.cos(E_sun * rad) - e_sun;
      const yv_sun = Math.sqrt(1.0 - e_sun * e_sun) * Math.sin(E_sun * rad);
      const r_sun = Math.sqrt(xv_sun * xv_sun + yv_sun * yv_sun);
      const v_sun = Math.atan2(yv_sun, xv_sun) * deg;
      const lon_sun = rev(v_sun + w_sun);

      const xs = r_sun * Math.cos(lon_sun * rad);
      const ys = r_sun * Math.sin(lon_sun * rad);

      const N_moon = rev(125.1228 - 0.0529538083 * d);
      const i_moon = 5.1454;
      const w_moon = rev(318.0634 + 0.1643573223 * d);
      const a_moon = 60.2666;
      const e_moon = 0.054900;
      const M_moon = rev(115.3654 + 13.0649929509 * d);

      const E_m = M_moon + e_moon * deg * Math.sin(M_moon * rad) * (1 + e_moon * Math.cos(M_moon * rad));
      const xv_m = a_moon * (Math.cos(E_m * rad) - e_moon);
      const yv_m = a_moon * Math.sqrt(1.0 - e_moon * e_moon) * Math.sin(E_m * rad);
      const v_m = Math.atan2(yv_m, xv_m) * deg;
      const r_m = Math.sqrt(xv_m * xv_m + yv_m * yv_m);

      const xh_m = r_m * (Math.cos(N_moon * rad) * Math.cos((v_m + w_moon) * rad) - Math.sin(N_moon * rad) * Math.sin((v_m + w_moon) * rad) * Math.cos(i_moon * rad));
      const yh_m = r_m * (Math.sin(N_moon * rad) * Math.cos((v_m + w_moon) * rad) + Math.cos(N_moon * rad) * Math.sin((v_m + w_moon) * rad) * Math.cos(i_moon * rad));
      const zh_m = r_m * (Math.sin((v_m + w_moon) * rad) * Math.sin(i_moon * rad));

      const moon_xe = xh_m;
      const moon_ye = yh_m * Math.cos(eclRad) - zh_m * Math.sin(eclRad);
      const moon_ze = yh_m * Math.sin(eclRad) + zh_m * Math.cos(eclRad);

      const moonRa = rev(Math.atan2(moon_ye, moon_xe) * deg) / 15;
      const moonDec = Math.atan2(moon_ze, Math.sqrt(moon_xe * moon_xe + moon_ye * moon_ye)) * deg;

      const sun_xe = xs;
      const sun_ye = ys * Math.cos(eclRad);
      const sun_ze = ys * Math.sin(eclRad);
      const sunRa = rev(Math.atan2(sun_ye, sun_xe) * deg) / 15;
      const sunDec = Math.atan2(sun_ze, Math.sqrt(sun_xe * sun_xe + sun_ye * sun_ye)) * deg;

      const bodies = [
        { name: "太陽", ra: sunRa, dec: sunDec, color: "#ffeeaa", mag: -26.7 },
        { name: "月",   ra: moonRa, dec: moonDec, color: "#eef8ff", mag: -12.5 }
      ];

      const planetsData = [
        { name: "水星", N: 48.3313 + 3.24587E-5*d, i: 7.0047 + 5.00E-8*d, w: 29.1241 + 1.01444E-5*d, a: 0.387098, e: 0.205635 + 5.59E-10*d, M: 168.6562 + 4.0923344368*d, color: "#b5a7a7", mag: -0.4 },
        { name: "金星", N: 76.6799 + 2.46590E-5*d, i: 3.3946 + 2.75E-8*d, w: 54.8910 + 1.38374E-5*d, a: 0.723330, e: 0.006773 - 1.302E-9*d, M: 48.0052 + 1.6021302244*d, color: "#ffea88", mag: -4.4 },
        { name: "火星", N: 49.5574 + 2.11081E-5*d, i: 1.8497 - 1.78E-8*d, w: 286.5016 + 2.92961E-5*d, a: 1.523688, e: 0.093405 + 2.516E-9*d, M: 18.6021 + 0.5240207766*d, color: "#ff6644", mag: -1.5 },
        { name: "木星", N: 100.4542 + 2.76854E-5*d, i: 1.3030 - 1.557E-7*d, w: 273.8777 + 1.64505E-5*d, a: 5.20256, e: 0.048498 + 4.469E-9*d, M: 19.8950 + 0.0830853001*d, color: "#ffcc88", mag: -2.5 },
        { name: "土星", N: 113.6655 + 2.38980E-5*d, i: 2.4886 - 1.081E-7*d, w: 339.3939 + 2.97661E-5*d, a: 9.55475, e: 0.055546 - 9.499E-9*d, M: 316.9670 + 0.0334442282*d, color: "#f4d090", mag: 0.2 },
        { name: "天王星", N: 74.0005 + 1.3978E-5*d, i: 0.7733 + 1.9E-8*d, w: 96.6612 + 3.0565E-5*d, a: 19.18171 - 1.55E-8*d, e: 0.047318 + 7.45E-9*d, M: 142.5905 + 0.011725806*d, color: "#aaffee", mag: 5.7 },
        { name: "海王星", N: 131.7806 + 3.0173E-5*d, i: 1.7700 - 2.55E-7*d, w: 272.8461 - 6.027E-6*d, a: 30.05826 + 3.313E-8*d, e: 0.008606 + 2.15E-9*d, M: 260.2471 + 0.005995147*d, color: "#5588ff", mag: 7.8 }
      ];

      planetsData.forEach(p => {
        const N = rev(p.N), i = p.i, w = rev(p.w), a = p.a, e = p.e, M = rev(p.M);
        let E = M + e * deg * Math.sin(M * rad) * (1 + e * Math.cos(M * rad));
        for (let k = 0; k < 3; k++) {
          E = E - (E - e * deg * Math.sin(E * rad) - M) / (1 - e * Math.cos(E * rad));
        }

        const xv = a * (Math.cos(E * rad) - e);
        const yv = a * Math.sqrt(1.0 - e * e) * Math.sin(E * rad);
        const v = Math.atan2(yv, xv) * deg;
        const r = Math.sqrt(xv * xv + yv * yv);

        const xh = r * (Math.cos(N * rad) * Math.cos((v + w) * rad) - Math.sin(N * rad) * Math.sin((v + w) * rad) * Math.cos(i * rad));
        const yh = r * (Math.sin(N * rad) * Math.cos((v + w) * rad) + Math.cos(N * rad) * Math.sin((v + w) * rad) * Math.cos(i * rad));
        const zh = r * (Math.sin((v + w) * rad) * Math.sin(i * rad));

        const xg = xh + xs, yg = yh + ys, zg = zh;
        const xe = xg, ye = yg * Math.cos(eclRad) - zg * Math.sin(eclRad), ze = yg * Math.sin(eclRad) + zg * Math.cos(eclRad);

        bodies.push({
          name: p.name,
          ra: rev(Math.atan2(ye, xe) * deg) / 15,
          dec: Math.atan2(ze, Math.sqrt(xe * xe + ye * ye)) * deg,
          color: p.color,
          mag: p.mag
        });
      });

      return bodies;
    }

    function createGlowTexture(colorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      gradient.addColorStop(0.0, '#ffffff');
      gradient.addColorStop(0.2, colorHex);
      gradient.addColorStop(0.5, colorHex);
      gradient.addColorStop(1.0, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradient;
      ctx.beginPath(); ctx.arc(64, 64, 64, 0, Math.PI * 2); ctx.fill();
      return new THREE.CanvasTexture(canvas);
    }

    function createTextSprite(text, colorCss) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      if (ctx.roundRect) {
        ctx.beginPath(); ctx.roundRect(16, 24, 224, 80, 16); ctx.fill();
        ctx.strokeStyle = colorCss; ctx.lineWidth = 3; ctx.stroke();
      } else {
        ctx.fillRect(16, 24, 224, 80);
      }
      ctx.font = 'Bold 40px sans-serif';
      ctx.fillStyle = colorCss;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 64);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.95 });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(4, 2, 1);
      return sprite;
    }

    function updateCanvasSize() {
      const width = window.visualViewport ? window.visualViewport.width : window.innerWidth;
      const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    function setupZoomControls() {
      const dom = renderer.domElement;

      const getDistance = (e) => {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      };

      dom.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          initialPinchDistance = getDistance(e);
          initialFov = camera.fov;
        }
      }, { passive: true });

      dom.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialPinchDistance !== null) {
          const currentDistance = getDistance(e);
          const factor = initialPinchDistance / currentDistance;
          // 最小FOVを10まで引き下げて、さらに大きくズームインできるように修正
          camera.fov = Math.max(10, Math.min(100, initialFov * factor));
          camera.updateProjectionMatrix();
        }
      }, { passive: true });

      dom.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          initialPinchDistance = null;
        }
      }, { passive: true });

      dom.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSpeed = 0.05;
        // ホイール操作時も最小FOVを10に設定
        camera.fov = Math.max(10, Math.min(100, camera.fov + e.deltaY * zoomSpeed));
        camera.updateProjectionMatrix();
      }, { passive: false });
    }

    function initThree() {
      const initialWidth = window.visualViewport ? window.visualViewport.width : window.innerWidth;
      const initialHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, initialWidth / initialHeight, 0.1, 1000);
      camera.position.set(0, 0, 0.1);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(initialWidth, initialHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
      document.body.appendChild(renderer.domElement);

      orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
      orbitControls.enableZoom = false;
      orbitControls.enablePan = false;
      orbitControls.rotateSpeed = -0.5;
      orbitControls.target.set(0, 0, 0);
      orbitControls.enabled = false;

      scene.add(solarSystemGroup);
      scene.add(constellationGroup);

      loadRealStarCatalog();
      setupSensorSync();
      setupZoomControls();

      window.addEventListener('resize', updateCanvasSize);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateCanvasSize);
      }

      window.addEventListener('orientationchange', () => {
        screenOrientation = window.orientation || 0;
        setTimeout(updateCanvasSize, 200);
      });
    }

    function setupSensorSync() {
      const handleOrientation = (e) => {
        if (isManualMode) return;

        let alpha = e.alpha || 0;
        let beta = e.beta || 0;
        let gamma = e.gamma || 0;

        if (!isHeadingInitialized) {
          let compassHeading = null;
          if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
            compassHeading = 360 - e.webkitCompassHeading;
          } else if (e.absolute && e.alpha !== null) {
            compassHeading = e.alpha;
          }

          if (compassHeading !== null) {
            headingOffset = compassHeading - alpha;
            isHeadingInitialized = true;
            sensorEl.innerText = "モード: 初期方位を固定・スムーズジャイロ追従中";
          }
        }

        deviceAlpha = alpha + headingOffset;
        deviceBeta = beta;
        deviceGamma = gamma;
      };

      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
      window.addEventListener('deviceorientation', handleOrientation, true);
    }

    const ze = new THREE.Vector3(0, 0, 1);
    const targetQuaternion = new THREE.Quaternion();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

    function updateCameraOrientation() {
      if (isManualMode) return;

      const alpha = THREE.MathUtils.degToRad(deviceAlpha);
      const beta = THREE.MathUtils.degToRad(deviceBeta);
      const gamma = THREE.MathUtils.degToRad(deviceGamma);
      const orient = THREE.MathUtils.degToRad(screenOrientation || 0);

      const qx = new THREE.Quaternion();
      const qy = new THREE.Quaternion();
      const qz = new THREE.Quaternion();

      qy.setFromAxisAngle(new THREE.Vector3(0, 1, 0), alpha);
      qx.setFromAxisAngle(new THREE.Vector3(1, 0, 0), beta);
      qz.setFromAxisAngle(ze, -gamma);

      targetQuaternion.copy(qy);
      targetQuaternion.multiply(qx);
      targetQuaternion.multiply(qz);

      targetQuaternion.multiply(q1);
      targetQuaternion.multiply(q0.setFromAxisAngle(ze, -orient));

      camera.quaternion.slerp(targetQuaternion, 0.2);
    }

    function requestSensorPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') {
            sensorEl.innerText = "モード: ジャイロ連動中";
          }
        }).catch(() => {});
      }
    }

    function getExactStarSize(mag, isConstellationStar) {
      if (isConstellationStar) {
        if (mag < 2.5) return 9.0;
        if (mag < 3.5) return 7.0;
        return 4.0;
      }

      const table = [
        [-1.5, 30.0],
        [ 0.0, 19.5],
        [ 1.0, 12.5],
        [ 2.0,  8.25],
        [ 3.0,  4.5],
        [ 6.0,  2.8],
        [ 8.5,  2.0]
      ];

      if (mag <= table[0][0]) return table[0][1];
      if (mag >= table[table.length - 1][0]) return table[table.length - 1][1];

      for (let i = 0; i < table.length - 1; i++) {
        const [m1, s1] = table[i];
        const [m2, s2] = table[i + 1];
        if (mag >= m1 && mag <= m2) {
          const t = (mag - m1) / (m2 - m1);
          return s1 + t * (s2 - s1);
        }
      }
      return 2.0;
    }

    function buildRealStarField() {
      if (!realStarsData.length) return;
      if (starMesh) scene.remove(starMesh);

      const geometry = new THREE.BufferGeometry();
      const positions = [], colors = [], sizes = [], opacities = [], mags = [];
      const now = new Date();
      const radius = 100;

      realStarsData.forEach(star => {
        const pos = raDecToAltAz(star.ra, star.dec, userLat, userLon, now);
        const vec = altAzToVector3(pos.alt, pos.az, radius);
        positions.push(vec.x, vec.y, vec.z);

        const c = star.color;
        colors.push(c.r, c.g, c.b);

        const starSize = getExactStarSize(star.mag, star.isConstellationStar);
        sizes.push(starSize);

        const normMag = Math.max(-1.5, Math.min(8.5, star.mag));
        const magRatio = 1.0 - (normMag + 1.5) / 10.0;
        let baseOpacity = 0.50 + Math.pow(magRatio, 1.5) * 0.50;

        if (star.isConstellationStar) {
          baseOpacity = Math.min(1.0, baseOpacity + 0.05);
        }

        opacities.push(baseOpacity);
        mags.push(star.mag);
      });

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));
      geometry.setAttribute('aOpacity', new THREE.Float32BufferAttribute(opacities, 1));
      geometry.setAttribute('aMag', new THREE.Float32BufferAttribute(mags, 1));

      const shaderMaterial = new THREE.ShaderMaterial({
        uniforms: { 
          pointTexture: { value: createStarTexture() },
          uFov: { value: camera.fov }
        },
        vertexShader: `
          attribute float aSize;
          attribute float aOpacity;
          attribute float aMag;
          uniform float uFov;
          varying vec3 vColor;
          varying float vOpacity;
          
          void main() {
            vColor = color;
            
            // 5.0等星以下の暗い星（5.0〜8.5等星）をズームアウト時（FOVが広がる際）に透過フェードアウト
            if (aMag > 5.0) {
              float zoomFactor = smoothstep(75.0, 30.0, uFov);
              vOpacity = aOpacity * zoomFactor;
            } else {
              vOpacity = aOpacity;
            }

            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = aSize * (180.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform sampler2D pointTexture;
          varying vec3 vColor;
          varying float vOpacity;
          
          void main() {
            if (vOpacity <= 0.001) discard;
            vec4 texColor = texture2D(pointTexture, gl_PointCoord);
            gl_FragColor = vec4(vColor, vOpacity) * texColor;
          }
        `,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      
      starMesh = new THREE.Points(geometry, shaderMaterial);
      scene.add(starMesh);

      buildSolarSystem(now);
      buildConstellations(now);
    }

    function buildConstellations(now) {
      while (constellationGroup.children.length > 0) {
        constellationGroup.remove(constellationGroup.children[0]);
      }
      if (!showConstellations || !constellationLinesData.length) return;

      const radius = 99;
      const lineMaterial = new THREE.LineBasicMaterial({ color: 0x66aaff, transparent: true, opacity: 0.6 });

      constellationLinesData.forEach(feature => {
        const geometry = feature.geometry;
        const lines = geometry.type === 'MultiLineString' ? geometry.coordinates : [geometry.coordinates];

        lines.forEach(line => {
          const points = [];
          line.forEach(pt => {
            const pos = raDecToAltAz(pt[0] / 15, pt[1], userLat, userLon, now);
            points.push(altAzToVector3(pos.alt, pos.az, radius));
          });

          if (points.length > 1) {
            const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
            constellationGroup.add(new THREE.Line(lineGeometry, lineMaterial));
          }
        });
      });
    }

    function buildSolarSystem(date) {
      while (solarSystemGroup.children.length > 0) {
        solarSystemGroup.remove(solarSystemGroup.children[0]);
      }

      const radius = 98;
      getSolarSystemPositions(date).forEach(body => {
        const pos = raDecToAltAz(body.ra, body.dec, userLat, userLon, date);
        const vec = altAzToVector3(pos.alt, pos.az, radius);

        let baseSize = body.mag < -10 ? 3.5 : (body.mag < -2 ? 2.5 : 1.8);

        const spriteMat = new THREE.SpriteMaterial({ map: createGlowTexture(body.color), transparent: true, blending: THREE.AdditiveBlending });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.position.copy(vec);
        sprite.scale.set(baseSize, baseSize, 1.0);
        solarSystemGroup.add(sprite);

        const label = createTextSprite(body.name, body.color);
        label.position.set(vec.x, vec.y + (baseSize * 0.3 + 1.0), vec.z);
        solarSystemGroup.add(label);
      });
    }

    function animate(nowTime) {
      requestAnimationFrame(animate);

      if (starMesh && starMesh.material.uniforms.uFov) {
        starMesh.material.uniforms.uFov.value = camera.fov;
      }

      if (nowTime - lastCalcTime > 10000) {
        if (realStarsData.length > 0) buildRealStarField();
        lastCalcTime = nowTime;
      }

      if (isManualMode) {
        orbitControls.update();
      } else {
        updateCameraOrientation();
      }

      renderer.render(scene, camera);
    }

    function fetchCurrentLocation() {
      locationEl.innerText = `観測地: 現在地を取得中...`;
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            userLat = position.coords.latitude;
            userLon = position.coords.longitude;
            cityName = "現在地（GPS）";
            locationEl.innerText = `観測地: ${cityName} (北緯${userLat.toFixed(1)}° 東経${userLon.toFixed(1)}°)`;
            if (realStarsData.length > 0) buildRealStarField();
            renderCityList();
          },
          (error) => {
            console.warn("位置情報の取得に失敗しました。デフォルト位置（東京）を使用します。", error);
            userLat = 35.6812;
            userLon = 139.7671;
            cityName = "東京 (デフォルト)";
            locationEl.innerText = `観測地: ${cityName}`;
            if (realStarsData.length > 0) buildRealStarField();
            renderCityList();
          },
          { timeout: 10000, maximumAge: 60000 }
        );
      } else {
        locationEl.innerText = `観測地: ${cityName}`;
      }
    }

    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const toggleIcon = document.getElementById('toggle-icon');
    const manualToggle = document.getElementById('manual-toggle');
    const constellationToggle = document.getElementById('constellation-toggle');
    const cityListEl = document.getElementById('city-list');
    const cityAccordionBtn = document.getElementById('city-accordion-btn');
    const cityAccordionContent = document.getElementById('city-accordion-content');
    const accordionArrow = document.getElementById('accordion-arrow');
    const reloadBtn = document.getElementById('reload-btn');

    sidebarToggle.addEventListener('click', () => {
      const isOpening = !sidebar.classList.contains('open');
      if (isOpening) {
        sidebar.classList.add('open');
        toggleIcon.innerText = 'close';
      } else {
        sidebar.classList.remove('open');
        toggleIcon.innerText = 'settings';
      }
    });

    reloadBtn.addEventListener('click', () => {
      fetchCurrentLocation();
      isHeadingInitialized = false;
      sensorEl.innerText = "モード: 方角を再取得中...";
    });

    manualToggle.addEventListener('change', (e) => {
      isManualMode = e.target.checked;
      orbitControls.enabled = isManualMode;
      if (isManualMode) {
        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);
        camera.position.copy(dir.multiplyScalar(-0.1));
        orbitControls.target.set(0, 0, 0);
        orbitControls.update();
        sensorEl.innerText = "モード: 手動ドラッグ操作中";
      } else {
        sensorEl.innerText = "モード: ジャイロ連動中";
      }
    });

    constellationToggle.addEventListener('change', (e) => {
      showConstellations = e.target.checked;
      buildConstellations(new Date());
    });

    cityAccordionBtn.addEventListener('click', () => {
      cityAccordionContent.classList.toggle('open');
      accordionArrow.innerText = cityAccordionContent.classList.contains('open') ? 'expand_less' : 'expand_more';
    });

    function renderCityList() {
      cityListEl.innerHTML = '';
      cities.forEach(city => {
        const item = document.createElement('div');
        item.className = `city-item ${cityName === city.name ? 'active' : ''}`;
        item.innerHTML = `<span>${city.name}</span>`;

        item.addEventListener('click', () => {
          userLat = city.lat;
          userLon = city.lon;
          cityName = city.name;
          locationEl.innerText = `観測地: ${cityName} (北緯${userLat.toFixed(1)}° 東経${userLon.toFixed(1)}°)`;
          buildRealStarField();
          renderCityList();
        });

        cityListEl.appendChild(item);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initThree();
      requestAnimationFrame(animate);
      fetchCurrentLocation();

      window.addEventListener('click', () => {
        requestSensorPermission();
      }, { once: true });
    });
  </script>
</body>
</html>
